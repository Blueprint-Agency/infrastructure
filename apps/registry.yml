# App Registry
# Central mapping of all apps to their repos, VPS targets, and configurations.
# Update this file whenever adding/removing an app.
# Last updated: 2026-09-12 (mail section added; bpvps2 mail stack removed, #12)

apps:
  - name: teeko-site-fe
    image: blueprintagency/teeko-website-fe
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 5000
    domain:
      staging: staging.teeko.ai
      production: teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site frontend (Next.js)"

  - name: teeko-site-be
    image: blueprintagency/teeko-website-be
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 3000
    domain:
      staging: stagingapi.teeko.ai
      production: api.teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site backend (Node.js)"

  - name: ehailing-be
    image: blueprintagency/ehailing-be
    tags:
      staging: staging
      production: ""           # not yet on production
    stack: ehailing
    vps:
      staging: vps3-prod       # NOTE: hosted on prod VPS3 even in staging phase
      production: ""
    port: 3000
    domain:
      staging: ehailingapi.teeko.ai
    db: supabase
    notes: "Teeko e-hailing backend (Fastify + Drizzle). Built from teeko-ehailing/apps/backend, staging branch. Uses dedicated ehailing-network."

  - name: booking-be
    image: blueprintagency/booking-be
    tags:
      staging: staging
      production: latest
    stack: booking-staging / booking-prod
    vps:
      staging: bpvps2
      production: bpvps2
    port: 4000
    domain:
      staging: api.dev.reservetoday.app
      production: api.reservetoday.app
    db: local-postgres
    notes: "Multi-tenant booking & management platform backend (Hono + Drizzle + Postgres).
      One deployment serves every studio; a studio is a Tenant row, never its own stack.
      Built from booking-system/be by that repo's deploy-be.yml: staging branch ->
      booking-staging stack, main branch -> booking-prod stack. BOTH instances live on
      bpvps2, sharing only Traefik — separate containers, volumes, networks and databases
      keyed off ENV_NAME in the shared compose file.
      The domains moved off teeko.ai to reservetoday.app; the registry said otherwise
      until 2026-08-31. Staging answers on api.dev, not api.staging — the frontends'
      staging tenants live under *.dev.reservetoday.app, and the backend was aligned to
      the same word rather than carrying a second one.
      The Traefik rule takes a full BOOKING_FQDN from each stack's .env,
      not a subdomain of the host-wide BASE_DOMAIN, and the certificate comes from the
      le-tls resolver (TLS-ALPN-01), NOT DNS-01 — see docs/tls-wildcard-constraint.md.
      Migrated off vps3-prod on 2026-07-21; staging carries the original data, prod
      started empty."

  - name: kaiteki-web
    image: blueprintagency/kaiteki-web
    tags:
      staging: staging
      production: prod
    stack: kaiteki-staging      # staging; production runs in the `kaiteki` stack
    vps:
      staging: bpvps1          # 4th VPS (187.127.122.41), alongside the production kaiteki stack
      production: bpvps1
    port: 3000
    domain:
      staging: staging.kaiteki.my
      production: kaiteki.my   # + www.kaiteki.my
    db: null
    notes: "Revamped Kaiteki site (Next.js 16, standalone). Built from Blueprint-Agency/kaiteki-web
      (app-managed stacks): staging branch → deploy-staging.yml → :staging → kaiteki-staging stack;
      main branch → deploy-prod.yml → :prod → kaiteki stack. Both on a separate Cloudflare account
      (proxied, Full) → Traefik default cert, no LE DNS-01.
      Cut over 2026-08-01 from the legacy blueprintagency/kaiteki-main-old; that repo
      (Blueprint-Agency/kaiteki-main-old) had its deploy.yml deleted and no longer publishes.
      Rollback: /root/stacks/kaiteki/docker-compose.yml.legacy-bak on bpvps1 pins the old image."

n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      staging: vps1-staging
    port: 5678
    domain:
      staging: stagingn8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      production: vps3-prod
    port: 5678
    domain:
      production: n8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

mcp_servers:
  - name: ga4-mcp
    image: blueprintagency/ga4-mcp
    tags:
      production: latest
    stack: ga4-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: ga4.teeko.ai
    notes: "Google Analytics MCP (github.com/googleanalytics/google-analytics-mcp), wrapped
      with mcp-proxy (github.com/sparfenyuk/mcp-proxy) since upstream is stdio-only with no
      HTTP transport or official image. Built by .github/workflows/build-ga4-mcp.yml (no
      version pins — rerun manually to pick up upstream updates). Fronted by an OAuth 2.1
      gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a claude.ai
      web custom connector. Single public host ga4.teeko.ai: Dex OAuth paths (Traefik priority
      100) -> ga4-dex:5556; everything else incl. /mcp (priority 1) -> ga4-gateway:9000, which
      enforces OAuth Bearer and reverse-proxies in-network to ga4-mcp:8080/servers/<token>/mcp/.
      The ga4-mcp backend has NO public route. Client URL: https://ga4.teeko.ai/mcp. Needs a GCP
      service account with GA4 property access, key mounted at credentials/sa-key.json
      (GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_PROJECT_ID)."

  - name: gsc-mcp
    image: blueprintagency/gsc-mcp
    tags:
      production: latest
    stack: gsc-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: gsc.teeko.ai
    notes: "Google Search Console MCP (github.com/AminForou/mcp-gsc, PyPI mcp-search-console),
      wrapped with mcp-proxy (upstream is stdio-only, no HTTP transport or image) and fronted by
      an OAuth 2.1 gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a
      claude.ai web custom connector. Single public host gsc.teeko.ai: Dex OAuth paths (Traefik
      priority 100) -> gsc-dex:5556; everything else incl. /mcp (priority 1) -> gsc-gateway:9000,
      which enforces OAuth Bearer and reverse-proxies in-network to gsc-mcp:8080/servers/<token>/mcp/.
      The gsc-mcp backend has NO public route. Client URL: https://gsc.teeko.ai/mcp. Backend image
      built by .github/workflows/build-gsc-mcp.yml (no version pins). Google auth via service account
      (reuses the ga4 SA): GSC_CREDENTIALS_PATH=/credentials/sa-key.json + GSC_SKIP_OAUTH=true; needs
      Search Console API enabled + the SA added as a user on the GSC property. Dex login via a static
      password (MCP_DEX_ADMIN_EMAIL / MCP_DEX_ADMIN_HASH, shared with ga4-mcp gateway). Secrets in
      vps3-prod env: GSC_MCP_PATH_TOKEN, GSC_MCP_SA_KEY_JSON."

tools:
  - name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest
    stack: tools
    vps:
      - vps1-staging          # stagingpg.teeko.ai — reaches db-site / db-n8n
      - vps2-prod             # pg.teeko.ai        — reaches db-site
      - vps3-prod             # pg3.teeko.ai       — reaches db-ehailing / db-booking
    port: 4983
    domain:
      staging: stagingpg.teeko.ai
      production: pg.teeko.ai
      production_vps3: pg3.teeko.ai
    notes: "Self-hosted Drizzle Studio. Replaced pgAdmin on all 3 Teeko VPS. Login with
      MASTERPASS (GATEWAY_MASTERPASS secret, shared by all three), then add DB connections
      in the UI by in-network hostname."

mail:
  # ONE platform, not one entry per domain. A mail domain is a row in Stalwart's store
  # (x:Domain/set), never its own stack, container or host — the same shape as booking's
  # tenants. Adding one is the `onboard-mail-domain` skill, not an edit to this file beyond
  # the `domains` list below.
  - name: stalwart
    image: stalwartlabs/stalwart:v0.16.21   # pinned; never :latest (see stack README)
    stack: stalwart
    vps:
      production: bpvps1
    domains:
      - kaiteki.my            # MX mail.kaiteki.my — the same box under its older name, kept for configured IMAP clients
      - blueprintdigital.my   # MX mail.blueprintdigital.my — the canonical host, Stalwart's default hostname
      - reservetoday.app      # MX mail.blueprintdigital.my — no vanity host; SPF ~all / p=quarantine because Clerk also sends
    domain:
      production: mail.blueprintdigital.my   # JMAP + self-service; mail.kaiteki.my is an alias of the same server
    db: rocksdb               # in the stalwart-data volume, /opt/stalwart/data
    notes: "Mail server for every Blueprint-side domain: SMTP/IMAP/POP3/JMAP/ManageSieve + DKIM +
      spam. Mail ports bind on the host; the JMAP/web side goes through Traefik's file provider
      with one acme.sh certificate (Cloudflare DNS-01, KAITEKI_CF_DNS_API_TOKEN) covering all
      mail./webmail. names — renew-cert.sh owns the name list. Needs the co-located `unbound`
      container for DNSBLs. No admin UI on 0.16.x: configuration is the JMAP `x:` API, shapes in
      vps/bpvps1/stacks/stalwart/README.md. Consolidated here 2026-09-12 (#5): the second
      instance on bpvps2 that served blueprintdigital.my from 2026-08-06 was deleted in #12."

  - name: bulwark
    image: ghcr.io/bulwarkmail/webmail:latest
    stack: stalwart
    vps:
      production: bpvps1
    port: 3000
    domain:
      production: webmail.blueprintdigital.my   # + webmail.kaiteki.my, same container, per-hostname branding
    db: null                  # stores no mail; JMAP client of stalwart
    notes: "Webmail for every domain on the platform, one container behind many hostnames.
      DOMAIN_BRANDING in the compose picks the brand per request Host (#11); a domain without
      its own webmail hostname (reservetoday.app) signs in at webmail.blueprintdigital.my.
      SESSION_SECRET must never rotate — it encrypts every user's saved settings."

