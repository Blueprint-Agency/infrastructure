# Expectations for reservetoday.app. Read by scripts/verify-mail.sh as
# `verify-mail.sh reservetoday.app`.
#
# The booking product's domain. It is NOT a greenfield mail domain: three Clerk apps
# already send auth mail from it (magic links, verification, resets) under their own
# `clk*` DKIM selectors, which is why SPF is SOFT and DMARC stays at quarantine -- see
# the parent spec (#5) and #10. Tighten to `-all` / `reject` only once DMARC reports
# show Clerk passing; until then a stricter expectation here would be asserting a
# posture we have deliberately not adopted.
#
# ⚠️ Vercel is authoritative for this zone (`vercel dns … reservetoday.app`, scope
# `blueprintdigitalmy`). The Cloudflare zone of the same name is a dead staged copy;
# a record added there changes nothing this script can see. CLAUDE.md has the detail.
#
# This domain has no `mail.` or `webmail.` host of its own, on purpose: it rides the
# shared platform hostname and the Blueprint webmail (spec, "Certificates" -- a vanity
# webmail would need DNS-01 against Vercel and is deferred). So every host below is a
# blueprintdigital.my name, and that is correct, not a copy-paste slip.
#
# Every value here must be non-empty. verify-mail.sh fails if one is blank, on the same
# principle as render-ci.py: a blank expectation is not a weaker check, it is no check.

# The host the MX points at, and the host that terminates mail TLS -- the platform's
# shared canonical mail host.
MAIL_HOST='mail.blueprintdigital.my'

# The Bulwark webmail hostname this domain's users sign in at. Blueprint's; there is no
# webmail.reservetoday.app.
WEBMAIL_HOST='webmail.blueprintdigital.my'

# What the domain's MX must resolve to. Published 2026-09-12 by #10 via `vercel dns add`.
EXPECT_MX='mail.blueprintdigital.my'

# The host the JMAP session must advertise in its absolute URLs -- Stalwart's default
# hostname, shared by every domain on the platform.
EXPECT_JMAP_HOST='mail.blueprintdigital.my'

# SPF posture. SOFT fail: `v=spf1 mx ~all`. Clerk sends from this domain and a hardfail
# could send its auth mail to spam. Not `-all` -- that is the deferred follow-up.
EXPECT_SPF_ALL='~all'

# DMARC policy. Quarantine, kept from before we ran mail here, for the same Clerk reason.
EXPECT_DMARC_POLICY='quarantine'

# Where aggregate reports go. The one platform collector (#14); it used to be the
# registrar's default third-party address and was repointed in #10.
EXPECT_DMARC_RUA='admin@blueprintdigital.my'

# DKIM selectors Stalwart publishes for this domain. Generated on bpvps1 in #8. Clerk's
# `clk` / `clk2` selectors live alongside these in the zone and are not ours to check.
DKIM_SELECTORS='v1-rsa-20260912 v1-ed25519-20260912'

# Branding fields Bulwark's /api/config must return for WEBMAIL_HOST, ONE field=value PER
# LINE. This is the Blueprint webmail, so it must answer with the Blueprint brand (#11).
BRANDING_EXPECT='appName=Blueprint Mail'

# Mailboxes to test when none are named on the command line. hello@ is the product's
# public inbox (#15); admin@ is the domain's own admin mailbox (#10). Both are ordinary
# mailboxes -- the platform Admin role is on admin@blueprintdigital.my, not here.
DEFAULT_ACCOUNTS='hello@reservetoday.app admin@reservetoday.app'

# The account scripts/mail-inventory.py enumerates with. Must hold Stalwart's Admin role,
# and the only Admin on the platform is the Blueprint one -- so it is not on this domain.
# Password: MAIL_PASSWORD_ADMIN_BLUEPRINTDIGITAL_MY in .env.
INVENTORY_ACCOUNT='admin@blueprintdigital.my'
