# Expectations for kaiteki.my. Read by scripts/verify-mail.sh as `verify-mail.sh kaiteki.my`.
#
# This file is the "expected" half of every check. It exists so that the posture a domain
# is SUPPOSED to have is reviewable in a diff rather than buried in the script -- the two
# domains this platform is growing to serve want different postures, and a script that
# hardcoded one of them would either fail the other or quietly accept both.
#
# Every value here must be non-empty. verify-mail.sh fails if one is blank, on the same
# principle as render-ci.py: a blank expectation is not a weaker check, it is no check.

# The host the MX points at, and the host that terminates mail TLS.
MAIL_HOST='mail.kaiteki.my'

# The Bulwark webmail hostname for this domain.
WEBMAIL_HOST='webmail.kaiteki.my'

# What the domain's MX must resolve to.
EXPECT_MX='mail.kaiteki.my'

# SPF posture. Hardfail, set 2026-07-30 after a forged support@kaiteki.my phish reached an
# inbox under the old ~all. This VPS ("mx") is the only authorised sender, so hardfail is
# safe here -- see the stalwart stack README before loosening it.
EXPECT_SPF_ALL='-all'

# DMARC policy. Reject, paired with the SPF hardfail above.
EXPECT_DMARC_POLICY='reject'

# DKIM selectors Stalwart publishes for this domain. Both are checked: the Ed25519 one is
# listed even though old verifiers report permerror on it, because the DNS record itself
# still has to be present and well-formed.
DKIM_SELECTORS='v1-rsa-20260628 v1-ed25519-20260628'

# Branding fields Bulwark's /api/config must return for this webmail hostname, ONE
# field=value PER LINE (values are human-facing strings with spaces in them). Today only
# appName is customised -- the login page is otherwise stock Bulwark -- so that is what is
# asserted. Add loginCompanyName and the logo URLs here when the branding ticket lands, and
# this check tightens with no change to the script.
BRANDING_EXPECT='appName=Kaiteki Mail'

# Mailboxes to test when none are named on the command line.
DEFAULT_ACCOUNTS='admin@kaiteki.my'
