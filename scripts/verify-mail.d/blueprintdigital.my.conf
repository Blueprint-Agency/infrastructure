# Expectations for blueprintdigital.my. Read by scripts/verify-mail.sh as
# `verify-mail.sh blueprintdigital.my`.
#
# This is the agency's own domain and, since the 2026-09-12 cutover (#9), the CANONICAL
# mail host for the whole platform: `mail.blueprintdigital.my` is Stalwart's default
# hostname on bpvps1 and the MX target every future client domain points at. kaiteki.my
# keeps its own `mail.kaiteki.my` name purely so already-configured devices keep working;
# both names are the same box (187.127.122.41).
#
# Every value here must be non-empty. verify-mail.sh fails if one is blank, on the same
# principle as render-ci.py: a blank expectation is not a weaker check, it is no check.

# The host the MX points at, and the host that terminates mail TLS.
MAIL_HOST='mail.blueprintdigital.my'

# The Bulwark webmail hostname for this domain.
WEBMAIL_HOST='webmail.blueprintdigital.my'

# What the domain's MX must resolve to.
EXPECT_MX='mail.blueprintdigital.my'

# The host the JMAP session must advertise in its absolute URLs -- Stalwart's default
# hostname, which for this domain is also its own mail host.
EXPECT_JMAP_HOST='mail.blueprintdigital.my'

# SPF posture. Hardfail: `v=spf1 mx -all`. The record used to carry `ip4:<bpvps2>` as
# well, which is exactly the literal that goes stale when the mail host moves -- it was
# dropped in the cutover so the record follows the MX and nothing else.
EXPECT_SPF_ALL='-all'

# DMARC policy. Reject, paired with the SPF hardfail above.
EXPECT_DMARC_POLICY='reject'

# Where aggregate reports go. This inbox is the ONE collector for every domain on the
# platform (#14): kaiteki.my and reservetoday.app point here too, and this zone carries a
# `<domain>._report._dmarc` TXT consent record for each of them.
EXPECT_DMARC_RUA='admin@blueprintdigital.my'

# DKIM selectors Stalwart publishes for this domain. Generated fresh on bpvps1 in #8; the
# 20260805 pair that bpvps2's Stalwart used was retired with the cutover and must NOT be
# listed here -- its private keys lived only in a store that was deleted with bpvps2's
# mail stack on 2026-09-12 (#12). They cannot come back.
DKIM_SELECTORS='v1-rsa-20260912 v1-ed25519-20260912'

# Branding fields Bulwark's /api/config must return for this webmail hostname, ONE
# field=value PER LINE. Blueprint is the GLOBAL brand in vps/bpvps1/stacks/stalwart/
# docker-compose.yml (#11) -- the agency default every hostname without its own
# DOMAIN_BRANDING entry falls back to -- so this check is also the proof that the global
# identity is set, not just that this hostname's override matched. The logo URLs must be
# our own files -- a stock /branding/Bulwark_* path fails regardless of what is written
# here -- and the version line must be off.
BRANDING_EXPECT='appName=Blueprint Mail
loginCompanyName=Blueprint Digital
loginWebsiteUrl=https://blueprintdigital.my
faviconUrl=/branding/blueprint/icon.svg
loginLogoLightUrl=/branding/blueprint/login-light.svg
loginLogoDarkUrl=/branding/blueprint/login-dark.svg
loginShowVersion=false'

# Mailboxes to test when none are named on the command line. admin@ is the platform
# administrator, but it is also a real mailbox on this domain (DMARC rua lands there), so
# "can it sign in" is still a behaviour test and not bookkeeping.
DEFAULT_ACCOUNTS='admin@blueprintdigital.my'

# The account scripts/mail-inventory.py enumerates with. Must hold Stalwart's Admin role.
# Password: MAIL_PASSWORD_ADMIN_BLUEPRINTDIGITAL_MY in .env.
INVENTORY_ACCOUNT='admin@blueprintdigital.my'
