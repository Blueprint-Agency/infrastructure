# Threshold alerts that hold for every monitored host at once (#25). Applied by
# scripts/grafana-apply.py; this file is the copy of record, not the web UI.
#
# These can be written once for all hosts because each fires on a value that is PRESENT and too
# high. Rules that must notice a series going MISSING cannot: absent_over_time has to name the
# host. Those are per host -- container-down-<host> (containers.yml), backup-stale-<host> and
# probes-stale-<host> (textfile.yml) -- and CI requires them for every monitored host.
# One exception lives here: mail-port-down, which reads bpvps2's probe OF bpvps1 -- a present
# value too, and there is only one mail host to watch.
#
# The policy is deliberately short. Any rule here that fires twice without a real problem is
# tuned or deleted the same week (docs/monitoring.md, "Tune or delete"). Each rule's meaning and
# first three checks are in that runbook, under its uid.
apiVersion: 1
groups:
  - orgId: 1
    name: hosts
    folder: Monitoring
    interval: 1m
    rules:
      # Real disks only -- config.alloy already drops overlay, tmpfs and the pseudo-filesystems.
      - uid: disk-warning
        title: Disk over 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [80]}
        # No disk data means no agent, which container-down-<host> already reports per host.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} is {{ humanize $values.A.Value }}% full"
          description: >-
            Over 80% for 5 minutes. Usually Docker images or container logs.
            `ssh bp-{{ $labels.host }} 'df -h; docker system df'`. Runbook: docs/monitoring.md.

      - uid: disk-critical
        title: Disk over 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} is {{ humanize $values.A.Value }}% full"
          description: >-
            Over 90% for 5 minutes. A full disk stops Postgres, Stalwart and Docker itself.
            `ssh bp-{{ $labels.host }} 'df -h; docker system df'`. Runbook: docs/monitoring.md.

      - uid: memory-high
        title: Memory over 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host) (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        # 15 minutes: a backup or an image build spikes memory for a few; a leak does not stop.
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} memory is {{ humanize $values.A.Value }}% used"
          description: >-
            Over 90% for 15 minutes. `ssh bp-{{ $labels.host }} 'free -m; docker stats --no-stream'`,
            or the Hosts dashboard's "Memory by container". Runbook: docs/monitoring.md.

      # container-down-<host> cannot see a crash loop: a container that restarts every few seconds
      # keeps reporting. Docker's RestartCount can -- it counts restarts by the restart policy, not
      # a `docker restart` or a deploy. From the textfile probes (probes/bin/probe.sh, job docker).
      - uid: container-restarting
        title: Container restart-looping
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host, container) (increase(docker_container_restarts_total[15m]))
          - refId: C
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [2]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.host }} restarted {{ humanize $values.A.Value }} times in 15 minutes"
          description: >-
            Crash-looping. `ssh bp-{{ $labels.host }} 'docker logs --tail 100 {{ $labels.container }}'`
            shows why it dies. Runbook: docs/monitoring.md.

      - uid: postgres-connections
        title: Postgres connections over 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host, container) (100 * postgres_connections / postgres_max_connections)
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [80]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.host }} is at {{ humanize $values.A.Value }}% of max_connections"
          description: >-
            At 100% every new connection is refused and the API errors. booking-db-staging holds the
            real studio data. Usually a connection-pool leak in the app, not load. Runbook:
            docs/monitoring.md.

      # Key expiry was disabled on every node on 2026-08-09. If it is ever back on, that node drops
      # off the tailnet on the date -- and with port 22 closed, recovery is the Hostinger console.
      - uid: tailscale-key-expiry
        title: Tailscale key expiry enabled
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host) (tailscale_key_expiry_timestamp_seconds)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}'s Tailscale key expires {{ humanizeTimestamp $values.A.Value }}"
          description: >-
            Self.KeyExpiry is present. Tailscale admin console -> Machines -> {{ $labels.host }} -> ...
            -> Disable key expiry. The next weekly check (Mon 10:17 KL) resolves this; to resolve now,
            `ssh bp-{{ $labels.host }} 'docker exec probes /app/bin/probe.sh tailscale'`.

      # The free tier's active-series ceiling. From Grafana Cloud's own usage datasource, not the
      # agents -- so it counts every series, synthetic checks included. 8000 = 80% of 10,000, the
      # documented ceiling; update both when the account figure is confirmed (docs/monitoring.md).
      - uid: series-budget
        title: Active series over 80% of the ceiling
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: max(grafanacloud_instance_active_series)
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [8000]}
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ humanize $values.A.Value }} active series -- over 80% of the 10,000 ceiling"
          description: >-
            Something new is expensive. Explore -> grafanacloud-usage, or
            `topk(10, count by (__name__) ({__name__=~".+"}))` on grafanacloud-prom. The usual cause
            is a new allowlisted metric with a per-something label. Runbook: docs/monitoring.md, "Budget".

      # bpvps1's mail ports, probed from bpvps2 (MAIL_PROBE_TARGET in its monitoring compose) --
      # never from bpvps1 itself, which only talks to itself, nor from a laptop, whose ISP blocks
      # 25. The prober counts consecutive failures itself, so "two in a row" does not depend on
      # scrape timing. The prober's own `host` is dropped and the MAIL host is set instead, so a
      # silence on host=bpvps1 covers it. #29's nightly mail-store snapshot stops Stalwart at 04:30:
      # 4 s measured, one failed probe at most. Its ~13 min worst case fires this -- correctly.
      - uid: mail-port-down
        title: Mail port unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (target, port) (mail_port_consecutive_failures{host="bpvps2"})
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [1]}
        # The prober's heartbeat is probes-stale-bpvps2's job.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          host: bpvps1
        annotations:
          summary: "{{ $labels.target }}:{{ $labels.port }} failed {{ humanize $values.A.Value }} probes in a row from bpvps2"
          description: >-
            Mail for every domain may be bouncing or unreadable. 25 = inbound SMTP, 465 = submission,
            993 = IMAP. `ssh bp-bpvps1 'docker ps --filter name=stalwart; docker logs --tail 50 stalwart'`.
            If every port fails at once, suspect the host, the Hostinger firewall group 319466, or a
            Stalwart ban on bpvps2's address. Runbook: docs/monitoring.md.
