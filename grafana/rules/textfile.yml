# Alerts on the textfile seam (#24, #25) -- signals producers write into the monitoring_textfile
# volume and the agent's textfile collector reads. Contract: docs/textfile-metrics.md.
# Applied by scripts/grafana-apply.py; this file is the copy of record, not the web UI.
#
# A producer reports when it last SUCCEEDED, never that it failed -- a stopped or crashed
# producer cannot report anything. So every producer's rule is a staleness rule: the age of its
# timestamp, OR its series being absent (a deleted file must read as failure, not silence).
# The absent half has to name the host, so staleness rules are one per host, and CI
# (check-monitoring.py) requires them for every monitored host: probes-stale-<host> always,
# backup-stale-<host> where the host runs the backup job.
apiVersion: 1
groups:
  - orgId: 1
    name: textfile
    folder: Monitoring
    interval: 1m
    rules:
      # The seam itself. The collector skips a file it cannot parse and sets this to 1 -- which
      # would otherwise look exactly like that producer going stale, and blame the wrong thing.
      # A present value, so one rule covers every host.
      - uid: textfile-unreadable
        title: Textfile metrics unreadable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host) (node_textfile_scrape_error)
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No series means no agent -- metrics-stale-<host> (ingestion.yml) reports that.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Textfile metrics on {{ $labels.host }}"
          value: "a *.prom file cannot be parsed"
          action: "`ssh bp-{{ $labels.host }} 'docker logs --tail 50 alloy'` names the broken *.prom file"
          description: >-
            The agent skips a malformed file, so that producer's metrics stop and its staleness
            alert follows. Usual cause: a producer writing in place instead of tmp + mv.

      # ── Producer: the textfile probes (#25) -- probes/bin/probe.sh in the monitoring stack ──
      # Each job's file carries its own heartbeat AND how old that may get (5 min for the
      # per-minute jobs, 8 days for the weekly Tailscale check), so one rule serves every job.
      # Fires with probe=... naming which one stopped (the label is `probe`, not `job`: the
      # agent's scrape owns `job` and renames a file's own to exported_job). A job that could not read its source (psql
      # failed, tailscaled did not answer, the mail prober found it IS the mail host) writes
      # nothing on purpose, and lands here.
      #
      # The age half reads `last_over_time(...[15m])`, never the bare series (#54). A bare
      # selector goes stale 5 minutes after its last sample and absent_over_time[15m] only
      # takes over 10 minutes later: in between the query returned nothing, which Grafana read
      # as resolved and which reset `for`. Same window on both halves, no gap.
      - uid: probes-stale-bpvps1
        title: Probe stopped on bpvps1
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  (time() - last_over_time(probes_last_success_timestamp_seconds{host="bpvps1"}[15m])
                    > on (host, probe) last_over_time(probes_max_age_seconds{host="bpvps1"}[15m]))
                  or absent_over_time(probes_last_success_timestamp_seconds{host="bpvps1"}[15m])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps1"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          host: bpvps1
        annotations:
          summary: '{{ with $labels.probe }}Probe "{{ . }}"{{ else }}Every probe{{ end }} on bpvps1'
          value: "{{ if $labels.probe }}no successful run within its max age{{ else }}no heartbeat at all{{ end }}"
          action: "`ssh bp-bpvps1 'docker ps --filter name=probes; docker logs --tail 50 probes'` shows why the job fails"
          description: >-
            While it is stale, the alert it feeds (restarts, Postgres, Tailscale) cannot fire.

      - uid: probes-stale-bpvps2
        title: Probe stopped on bpvps2
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  (time() - last_over_time(probes_last_success_timestamp_seconds{host="bpvps2"}[15m])
                    > on (host, probe) last_over_time(probes_max_age_seconds{host="bpvps2"}[15m]))
                  or absent_over_time(probes_last_success_timestamp_seconds{host="bpvps2"}[15m])
                  or absent_over_time(probes_last_success_timestamp_seconds{host="bpvps2", probe="mail"}[15m])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps2"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          host: bpvps2
        annotations:
          summary: '{{ with $labels.probe }}Probe "{{ . }}"{{ else }}Every probe{{ end }} on bpvps2'
          value: "{{ if $labels.probe }}no successful run within its max age{{ else }}no heartbeat at all{{ end }}"
          action: "`ssh bp-bpvps2 'docker ps --filter name=probes; docker logs --tail 50 probes'` shows why the job fails"
          description: >-
            While it is stale, the alert it feeds cannot fire. probe=mail stale means bpvps1's
            mail ports are NOT being watched: bpvps2 is the only mail prober.

      # ── Producer: the backup job (#27, #28), after each target's snapshot ────────────────
      # Nightly (bpvps2 03:30, bpvps1 04:30 KL), so 26 h is one missed night plus slack.
      #
      # TWO tiers per host (#54). One missed night is a WARNING: last night's snapshot is still
      # there and tonight's run may simply work. Two missed nights (50 h) is CRITICAL:
      # backup-critical-<host>, below each. The warning stops at 51 h so the critical replaces
      # it rather than joining it -- an hour after the critical starts, not at the same moment,
      # so there is never a stretch where the warning has resolved and the critical is still
      # waiting out its `for`. A heartbeat that is missing altogether warns after 15 minutes
      # (the file is gone, the last snapshot is not) and is critical as well once no sample
      # has been seen for 50 hours; that warning has no age to stop at, and stays on beside it.
      # The age reads last_over_time[15m] for the reason given above probes-stale.
      #
      # Every staleness rule in this file also requires the host's own metrics to be arriving
      # (`and on () count_over_time(node_memory_MemTotal_bytes[2m]) > 0`), like container-down
      # (containers.yml, #54). When the agent dies EVERY textfile series goes absent, and
      # these used to answer "every probe stopped" and "every backup target has no heartbeat"
      # twenty minutes into an outage that was neither. A dead agent is metrics-stale-<host>,
      # once. The cost is stated in the runbook: while it fires, probes and backups are unwatched.
      - uid: backup-stale-bpvps1
        title: Backup heartbeat stale on bpvps1
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  ((time() - last_over_time(backup_last_success_timestamp_seconds{host="bpvps1"}[15m]) > 26 * 3600) <= 51 * 3600)
                  or absent_over_time(backup_last_success_timestamp_seconds{host="bpvps1"}[15m])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps1"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          host: bpvps1
        annotations:
          summary: '{{ with $labels.target }}Backup "{{ . }}"{{ else }}Every backup target{{ end }} on bpvps1'
          value: "{{ if $labels.target }}no success in over 26 hours (one night missed){{ else }}no heartbeat at all{{ end }}"
          runbook_url: https://github.com/Blueprint-Agency/infrastructure/blob/main/docs/backup-restore.md
          action: "`ssh bp-bpvps1 'docker logs --tail 100 backup'`. To run it now: `docker exec backup /app/bin/backup.sh`"
          description: >-
            A target's snapshot failed last night, or backup.prom is gone. The previous snapshot
            is still in the repository.

      - uid: backup-critical-bpvps1
        title: Backup missed two nights on bpvps1
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 183600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  (time() - last_over_time(backup_last_success_timestamp_seconds{host="bpvps1"}[15m]) > 50 * 3600)
                  or absent_over_time(backup_last_success_timestamp_seconds{host="bpvps1"}[50h])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps1"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 183600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          host: bpvps1
        annotations:
          summary: '{{ with $labels.target }}Backup "{{ . }}"{{ else }}Every backup target{{ end }} on bpvps1'
          value: "{{ if $labels.target }}no success in over 50 hours (two nights missed){{ else }}no heartbeat for 50 hours{{ end }}"
          runbook_url: https://github.com/Blueprint-Agency/infrastructure/blob/main/docs/backup-restore.md
          action: "`ssh bp-bpvps1 'docker logs --tail 100 backup'`. To run it now: `docker exec backup /app/bin/backup.sh`"
          description: >-
            Two nightly runs in a row did not succeed. The newest snapshot of the mail store is
            over two days old.

      - uid: backup-stale-bpvps2
        title: Backup heartbeat stale on bpvps2
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  ((time() - last_over_time(backup_last_success_timestamp_seconds{host="bpvps2"}[15m]) > 26 * 3600) <= 51 * 3600)
                  or absent_over_time(backup_last_success_timestamp_seconds{host="bpvps2"}[15m])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps2"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # Every target fresh -> the query returns nothing. That is the healthy state.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          host: bpvps2
        annotations:
          summary: '{{ with $labels.target }}Backup "{{ . }}"{{ else }}Every backup target{{ end }} on bpvps2'
          value: "{{ if $labels.target }}no success in over 26 hours (one night missed){{ else }}no heartbeat at all{{ end }}"
          runbook_url: https://github.com/Blueprint-Agency/infrastructure/blob/main/docs/backup-restore.md
          action: "`ssh bp-bpvps2 'docker logs --tail 100 backup'`. To run it now: `docker exec backup /app/bin/backup.sh`"
          description: >-
            A target's snapshot failed last night, or backup.prom is gone. The previous snapshot
            is still in the repository.

      - uid: backup-critical-bpvps2
        title: Backup missed two nights on bpvps2
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 183600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: |
                (
                  (time() - last_over_time(backup_last_success_timestamp_seconds{host="bpvps2"}[15m]) > 50 * 3600)
                  or absent_over_time(backup_last_success_timestamp_seconds{host="bpvps2"}[50h])
                )
                and on () (count_over_time(node_memory_MemTotal_bytes{host="bpvps2"}[2m]) > 0)
          - refId: C
            relativeTimeRange: {from: 183600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          host: bpvps2
        annotations:
          summary: '{{ with $labels.target }}Backup "{{ . }}"{{ else }}Every backup target{{ end }} on bpvps2'
          value: "{{ if $labels.target }}no success in over 50 hours (two nights missed){{ else }}no heartbeat for 50 hours{{ end }}"
          runbook_url: https://github.com/Blueprint-Agency/infrastructure/blob/main/docs/backup-restore.md
          action: "`ssh bp-bpvps2 'docker logs --tail 100 backup'`. To run it now: `docker exec backup /app/bin/backup.sh`"
          description: >-
            Two nightly runs in a row did not succeed. The newest snapshot of the booking
            databases, the real studio data among them, is over two days old.

      # Producer: canary.prom -- the seam's own test fixture, not a service. Inert while the file
      # does not exist on any host. The test in docs/textfile-metrics.md writes it, lets it age
      # past five minutes, refreshes it, then deletes it. Kept permanently so it can be rerun.
      - uid: textfile-canary-stale
        title: Textfile canary stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: max by (host) (time() - textfile_canary_timestamp_seconds)
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [300]}
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Textfile canary on {{ $labels.host }}"
          value: "{{ humanizeDuration $values.A.Value }} old"
          action: "Delete /textfile/canary.prom on {{ $labels.host }}, unless the seam test is running right now"
          description: >-
            Expected only during the textfile seam test in docs/textfile-metrics.md. Outside it, someone
            left /textfile/canary.prom behind: delete it and this resolves.
