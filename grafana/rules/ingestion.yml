# Alerts on whether what we ship REACHES Grafana Cloud (infrastructure#40): whether it will take
# the logs (the first two rules), and whether each host's metrics are arriving at all (the rest,
# "Metrics arriving", below). Applied by scripts/grafana-apply.py; this file is the copy of
# record, not the web UI.
#
# ── Why this file exists ─────────────────────────────────────────────────────────────────────
# On 2026-10-09 the free tier's 50 GB/month of logs ran out, and Loki then answered every push
# from both hosts `429 ... ingestion rate limit exceeded (limit: 0 bytes/sec)` until the counter
# reset on the 1st (UTC). Nothing alerted: every log-based rule (grafana/rules/booking.yml, the
# cron heartbeats among them) read a stream that had stopped arriving, and a rule that reads
# nothing reads as healthy. Metrics kept flowing the whole time. docs/monitoring.md, "Budget".
#
# ── What these read, and why it is safe to ──────────────────────────────────────────────────
# `grafanacloud-usage`, Grafana Cloud's own metering datasource -- the same one series-budget
# (hosts.yml) uses. It is written by Grafana about the account, not by Alloy about the hosts, so
# it does not go quiet when an agent is refused (a 401 from a revoked token, a 429 from this
# quota) and it does not depend on Loki: both rules below are metric queries. That is the
# property #40 asks of any rule that watches ingestion -- it must not depend on the pipeline it
# is watching.
#
#   grafanacloud_org_logs_usage                      GB ingested so far this billing month
#   grafanacloud_org_logs_included_usage             GB the plan includes (50 on the free tier)
#   grafanacloud_logs_instance_discarded_bytes_per_second{reason="rate_limited"}
#                                                    bytes/s Loki refused, by reason
#   grafanacloud_org_sm_billable_check_executions / ..._sm_included_check_executions
#                                                    synthetic check runs this month / included
#   grafanacloud_org_db_o11y_billable_host_hours / ..._db_o11y_included_host_hours
#                                                    Database Observability hours / included
#
# Three of the rules are FORECASTS (#54): logs-pace, sm-executions-pace, dbo11y-hours-pace.
# The second logs incident, November 2026, was 80% used with two days left before anyone was
# told. A forecast says so on day one. The arithmetic is above logs-pace.
#
# ── No data ──────────────────────────────────────────────────────────────────────────────────
# The two logs rules answer No Data differently, on purpose.
#
# logs-quota-budget: `Alerting`. The usage gauge is always present -- it, and the included
# figure beside it, answered every query made on the day of writing -- so an empty result means
# the usage datasource or the metric is gone, and then NOTHING can warn about the quota. That is
# the blind spot this file exists to close, so it speaks. `for: 15m` rides out one slow evaluation.
#
# logs-dropped: `OK`. The discarded series is SPARSE: it did not exist before 2026-10-09 and
# exists only while Loki is refusing something (queried over 35 days: no `rate_limited` samples
# at all before the cut-off). Absence is the healthy state, so No Data must not alert. The
# datasource itself vanishing is logs-quota-budget's job -- same datasource, and it alerts.
#
# ── Metrics arriving (the 2026-09-20 incident) ───────────────────────────────────────────────
# From 03:28 to ~07:00 UTC on 2026-09-20 the agents' write token was revoked. `alloy` on both
# hosts and `db-observability` logged only `status=401 ... invalid token` and dropped every
# batch, and nothing alerted for three and a half hours. The rules below are evaluated by
# Grafana against data Grafana holds, so when an agent goes quiet they see the quiet: they need
# nothing from the agent, the token or the host. That is the property #40 asks for.
#
# metrics-stale-<host>: a HEARTBEAT, not absent_over_time. node_memory_MemTotal_bytes is one
# series per host, scraped every 60 s by the host exporter inside `alloy`, allowlisted, and there
# whatever containers run, so a healthy host has 3 samples in any 3 minutes (the 7 days to
# 2026-11-11: never fewer, on either host). `sum(...)` drops every label and `or vector(0)` turns
# "no series" into an explicit 0, so healthy and broken are the SAME labelless instance and the
# alert moves Normal -> Pending -> Alerting on it. A `by (host)` query would not: the healthy
# instance would vanish (Grafana reads that as resolved) and the zero would have no host to name.
# The host is named by the static `host` label instead. noDataState is `Alerting` on top: the
# query cannot return nothing any more, so No Data can only mean the datasource failed to answer,
# and then nothing about the host can be trusted either. Silence is never read as health here.
#   Timing: the count reaches 0 three minutes after the last sample, `for: 2m` holds it, so
#   Alerting 5-6 minutes after the agent stopped shipping. It resolves on the first sample back.
#   It was 5m + 4m until #54. That was affordable while container-down-<host> also fired for
#   every container about 4 minutes in; container-down now stays quiet when the host's metrics
#   stop (containers.yml), so THIS is the page for a dead host and it must not be the slow one.
#   One per host, like container-down- and probes-stale-: CI (vps/shared/check-monitoring.py)
#   requires a metrics-stale-<host> for every monitored host, its selector pinned to that host.
#   It watches `alloy`, not bpvps2's db-observability, which shares the token: a revoked token
#   stops both, and this fires; db-observability failing alone does not fire it.
#
# metrics-received-zero: the metrics instance's own received-samples rate, from
# grafanacloud-usage. Nothing in it comes from our agents or through the grafanacloud-prom query
# path. It is a BACKSTOP, and it would NOT have fired on 2026-09-20: Synthetic Monitoring
# publishes with its own credential, so with both agents refused the instance still received ~23
# samples/s (26 before; the hosts are the small share). It fires only when NOTHING arrives -- the
# instance, the account or Grafana's ingest gone. A revoked agent token is metrics-stale-<host>'s.
# No Data is `Alerting`: whether this series goes to 0 or disappears when nothing arrives has
# never been observed, so both must fire.
#
# No logs-side twin of either. `grafanacloud_logs_instance_bytes_received_per_second` stayed at
# ~2,600 B/s through 2026-09-20 (Synthetic Monitoring's logs again), and it counts bytes Loki
# refuses too: ~6,300 B/s on 2026-10-25, with the allowance spent. A Loki query per host needs a
# line every host writes on a schedule, and none does. Today it would also fire until the 1st.
#
# No `app` label on any rule here: logs and the agents are shared by every app, so these land in
# the infra channel (grafana/alerting/notifications.yml, docs/monitoring.md "Where an alert lands").
apiVersion: 1
groups:
  - orgId: 1
    name: ingestion
    folder: Monitoring
    interval: 1m
    rules:
      # 80% of the plan's own figure, read from the account rather than hardcoded -- the
      # opposite choice to series-budget's 8000, because here the ceiling is exported, so a plan
      # change moves the threshold with it. The usage resets on the 1st, UTC, and this resolves
      # then. 80% is a warning: at the rate that spent the month in nine days (6 GB/day) the
      # remaining 10 GB is under two days; at the ~2 MB/day of ordinary logs it is never reached.
      - uid: logs-quota-budget
        title: Logs over 80% of the monthly allowance
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: 100 * max(grafanacloud_org_logs_usage) / max(grafanacloud_org_logs_included_usage)
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [80]}
        noDataState: Alerting
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Grafana Cloud logs allowance this month"
          # `with` because a No Data instance has no A to print.
          value: '{{ with $values.A }}{{ printf "%.0f" $values.A.Value }}% of the month''s included logs used{{ else }}the usage figure cannot be read{{ end }}'
          action: 'Explore -> grafanacloud-logs: `sum by (host, container, op) (bytes_over_time({host=~".+"}[1h]))`, stop the top one'
          description: >-
            At 100% Loki refuses every push from both hosts until the 1st (UTC), and every
            log-based alert goes blind. Both 2026 incidents were Database Observability's
            query_details collector (docs/monitoring.md, "Budget").

      # The FORECAST (#54). The rule above speaks at 80% used, which in November 2026 was two
      # days before the cut-off; this one speaks on the first day of a bleed. It adds the last
      # 24 hours' growth, repeated for every day left in the month, to what is already used,
      # and fires when that passes 100% of the allowance -- "at this pace the logs run out
      # before the 1st". Over 100, not 80: a month that will END at 85% is the rule above's to
      # report, once, when it gets there.
      #
      # The billing month is the calendar month in UTC, which is what day_of_month() and
      # hour() count in. On the 1st, `offset 1d` reads last month's closing figure, the
      # difference is negative and clamp_min makes it 0 -- so the forecast is quiet for the
      # first 24 hours of a month and then real. After a fix it takes up to 24 hours to clear,
      # because the window still holds the bleed. Ordinary growth is ~0.1 GB a day.
      - uid: logs-pace
        title: Logs on pace to run out this month
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: |
                100 * (
                  max(grafanacloud_org_logs_usage)
                  + clamp_min(max(grafanacloud_org_logs_usage) - max(grafanacloud_org_logs_usage offset 1d), 0)
                    * (days_in_month() - day_of_month() + 1 - hour() / 24)
                ) / max(grafanacloud_org_logs_included_usage)
          - refId: C
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [100]}
        # The usage figure vanishing is logs-quota-budget's to report -- same datasource.
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Grafana Cloud logs allowance, at the last 24 hours' pace"
          value: '{{ printf "%.0f" $values.A.Value }}% of the month''s allowance by the 1st'
          action: 'Explore -> grafanacloud-logs: `sum by (host, container, op) (bytes_over_time({host=~".+"}[1h]))`, stop the top one'
          description: >-
            Something is sending far more than usual. If nothing changes, Loki starts refusing
            every push before the month ends. Stays on for up to 24 hours after the fix.

      # The consequence, not the forecast: this fires when bytes are ACTUALLY being thrown away.
      # `reason="rate_limited"` is the 429 -- the zero-byte limit after the allowance is spent,
      # but also a plain burst over the per-second limit while usage is still under 100%, which
      # is why this does not simply repeat logs-quota-budget. max_over_time over 15 minutes
      # rather than the last sample, so a gap between the series' samples cannot let a firing
      # alert flap closed; the cost is that it resolves ~15 minutes after the last drop.
      # `greater_than_max_sample_age` is deliberately not counted: a first deploy replays old
      # logs and Loki refuses the oldest (docs/monitoring.md, "Budget") -- once, and no loss.
      #
      # A WARNING since #54. With the allowance spent there is nothing to do until the 1st, and
      # as a critical this repeated hourly ~165 times in October 2026. The actionable alert is
      # logs-pace above, days earlier. The right response here is a silence that ends on the 1st.
      - uid: logs-dropped
        title: Loki is refusing log pushes
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: sum(max_over_time(grafanacloud_logs_instance_discarded_bytes_per_second{reason="rate_limited"}[15m]))
          - refId: C
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Grafana Cloud logs ingestion"
          value: "refused up to {{ humanize $values.A.Value }} bytes/s of logs in the last 15 minutes"
          action: "Allowance at 100%: silence this until the 1st (UTC). Under 100%: a burst, find the stream that spiked"
          description: >-
            Logs are being dropped right now, so log-based alerts are blind and the lines are
            gone for good. The booking job heartbeats stay quiet on purpose while this fires.

      # ── Metrics arriving. One heartbeat per host, then the account-wide backstop. ─────────
      - uid: metrics-stale-bpvps1
        title: No metrics arriving from bpvps1
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: sum(count_over_time(node_memory_MemTotal_bytes{host="bpvps1"}[3m])) or vector(0)
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
          host: bpvps1
        annotations:
          summary: "Metrics from bpvps1 reaching Grafana Cloud"
          value: "{{ with $values.A }}{{ humanize $values.A.Value }} samples in the last 3 minutes, 3 expected{{ else }}the query returned nothing{{ end }}"
          action: "`ssh bp-bpvps1 'docker ps -a --filter name=alloy; docker logs --tail 20 alloy'`. No SSH: the host is down"
          description: >-
            Every metric-based alert for bpvps1 is blind, its containers included. Both hosts at
            once, or `401 invalid token` in the log: the shared GRAFANA_CLOUD_API_TOKEN.

      - uid: metrics-stale-bpvps2
        title: No metrics arriving from bpvps2
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              range: false
              expr: sum(count_over_time(node_memory_MemTotal_bytes{host="bpvps2"}[3m])) or vector(0)
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
          host: bpvps2
        annotations:
          summary: "Metrics from bpvps2 reaching Grafana Cloud"
          value: "{{ with $values.A }}{{ humanize $values.A.Value }} samples in the last 3 minutes, 3 expected{{ else }}the query returned nothing{{ end }}"
          action: "`ssh bp-bpvps2 'docker ps -a --filter name=alloy; docker logs --tail 20 alloy'`. No SSH: the host is down"
          description: >-
            Every metric-based alert for bpvps2 is blind, booking's containers and Postgres
            included. Both hosts at once, or `401 invalid token` in the log: the shared
            GRAFANA_CLOUD_API_TOKEN.

      # Zero, read as under 0.01/s: a per-second rate is a float, and anything under one sample a
      # minute in every minute of the window is nothing arriving. Healthy is ~20-30/s, and the
      # lowest 5-minute maximum in the 30 days to 2026-10-25 was 2.8/s. 5m window + `for: 5m`:
      # fires after ~10 minutes of nothing.
      - uid: metrics-received-zero
        title: Grafana Cloud is receiving no metrics
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: max(max_over_time(grafanacloud_instance_samples_per_second[5m]))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [0.01]}
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Samples received by the Grafana Cloud metrics instance"
          value: "{{ with $values.A }}at most {{ humanize $values.A.Value }} samples/s in the last 5 minutes{{ else }}the received-samples figure cannot be read{{ end }}"
          action: "Check status.grafana.com, then the Grafana Cloud portal's billing and usage page"
          description: >-
            Nothing arrives at all: not from either agent, not from Synthetic Monitoring. That is
            Grafana Cloud or the account, not one host.

      # ── Budgets: the other two metered products we use (#54) ──────────────────────────────
      # Same forecast as logs-pace, same datasource, same reason it is safe: the usage figures
      # are written by Grafana about the account and do not stop when an agent is refused.
      # One rule each, on the forecast only -- it can never be below what is already used, so
      # "on pace to pass 90%" also covers "already past 90%".
      #
      # Synthetic Monitoring: 100,000 check executions a month on the free tier, and at 100%
      # EVERY check stops -- all endpoint and certificate alerts at once. Eleven checks use
      # ~68% (2,264 a day, measured 2026-11-11; the arithmetic is grafana/synthetic/
      # endpoints.yml). One more 2-minute check would pass it. 90, not 100: there is no slack
      # to wait for, and the only fix is a slower or a removed check.
      - uid: sm-executions-pace
        title: Synthetic checks on pace to run out this month
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: |
                100 * (
                  max(grafanacloud_org_sm_billable_check_executions)
                  + clamp_min(max(grafanacloud_org_sm_billable_check_executions) - max(grafanacloud_org_sm_billable_check_executions offset 1d), 0)
                    * (days_in_month() - day_of_month() + 1 - hour() / 24)
                ) / max(grafanacloud_org_sm_included_check_executions)
          - refId: C
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [90]}
        # Alerting, unlike logs-pace: no other rule reads this figure, so if Grafana renames
        # the metric an OK here would leave the budget unwatched and nobody told.
        noDataState: Alerting
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Synthetic Monitoring executions, at the last 24 hours' pace"
          value: '{{ with $values.A }}{{ printf "%.0f" $values.A.Value }}% of the month''s allowance by the 1st{{ else }}the usage figure cannot be read{{ end }}'
          action: "Slow or drop a check in grafana/synthetic/endpoints.yml, then `python scripts/grafana-apply.py`"
          description: >-
            At 100% every check stops until the 1st (UTC), and every endpoint and certificate
            alert goes blind with them.

      # Database Observability is metered in HOST-HOURS: 2,232 a month included, which is three
      # instances for a 31-day month. Two booking Postgres instances use 48 a day, ~64% of it.
      # A fourth instance would pass it, and nothing else would say so.
      - uid: dbo11y-hours-pace
        title: Database Observability on pace to run out this month
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: A
              instant: true
              range: false
              expr: |
                100 * (
                  max(grafanacloud_org_db_o11y_billable_host_hours)
                  + clamp_min(max(grafanacloud_org_db_o11y_billable_host_hours) - max(grafanacloud_org_db_o11y_billable_host_hours offset 1d), 0)
                    * (days_in_month() - day_of_month() + 1 - hour() / 24)
                ) / max(grafanacloud_org_db_o11y_included_host_hours)
          - refId: C
            relativeTimeRange: {from: 90000, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [100]}
        # Alerting, for the reason given on sm-executions-pace.
        noDataState: Alerting
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Database Observability host-hours, at the last 24 hours' pace"
          value: '{{ with $values.A }}{{ printf "%.0f" $values.A.Value }}% of the month''s allowance by the 1st{{ else }}the usage figure cannot be read{{ end }}'
          action: "More than 3 Postgres instances report to Database Observability: take one out of db-observability"
          description: >-
            The free tier includes three instances' worth of host-hours a month, and this pace
            ends the month past it.
