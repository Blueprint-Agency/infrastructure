# booking-system's own alert rules (Blueprint-Agency/booking-system#166). Applied by
# scripts/grafana-apply.py; this file is the copy of record, not the web UI.
#
# ⚠️ EVERY rule here carries `app: booking` in its static labels. That label -- not this file,
# not the folder -- is what routes an alert to the `discord-booking` contact point
# (grafana/alerting/notifications.yml). A booking rule that forgets it is not silent: it falls
# through to the infra severity routes and arrives in the INFRA channel, which is the wrong room
# and harder to notice than silence. Why the label and not the folder:
# docs/research/grafana-multi-app-alert-routing.md, §3.
#
# Folder `Apps`, not `Monitoring`: docs/grafana-organization.md files application rules there.
# The folder is filing; `grafana_folder` only keeps these out of the infra groups.
#
# ── What these read ──────────────────────────────────────────────────────────────────────────
# Logs, not metrics: the backend writes one Pino JSON object per line and Alloy ships every
# line to Loki (vps/bpvps2/stacks/monitoring/config.alloy). The stream labels are `host`,
# `container`, `compose_project`, `compose_service` and -- on booking-be only -- `level`, the
# Pino level. NOTHING else in the line is a label: `requestId`, `tenantId`, `actorId`, `job`,
# `webhook` and `outcome` are read at query time with `| json`, because the first three are
# unbounded and would be a stream per request, per Tenant, per user. docs/monitoring.md, "Labels".
#
# A Tenant is always its id in these queries, never a studio's name. No rule here may name one.
#
# ── staging AND prod ─────────────────────────────────────────────────────────────────────────
# One compose file deployed twice on bpvps2, so both instances share `compose_service:
# booking-be` and are told apart by `container` (booking-be-staging / booking-be-prod) -- the
# same way containers.yml tells them apart. There is no `env` label: the agent does not set one,
# and no existing rule invents one. So the rules that report a PRESENT value select on
# `compose_service` and group by `(host, container)`, and the container name in the message says
# which instance -- one rule covering both, and a third instance the day there is one.
#
# ── Silence cannot be grouped ────────────────────────────────────────────────────────────────
# The rules that must notice ABSENCE cannot do that. A Loki count with no matching lines returns
# no series at all, and a `sum by (...)` over nothing yields nothing -- so the one instance that
# stopped would simply vanish rather than alert, exactly as a stopped container's metric series
# does (containers.yml). Those rules therefore name their container and their job literally, one
# rule each, and turn "no lines" into the number 0 with `or vector(0)` so the threshold has
# something to compare. `noDataState: Alerting` is the second lock on the same door: if Loki
# returns no frame at all, that is still not health, and this rule says so.
apiVersion: 1
groups:
  - orgId: 1
    name: booking
    folder: Apps
    interval: 1m
    rules:
      # ── 1. Error-rate spike ──────────────────────────────────────────────────────────────
      # The backend logs exactly one `level=error` line per unhandled error
      # (booking-system#162), so this counts errors, not log volume.
      #
      # ⚠️ THE THRESHOLD IS A GUESS, NOT A MEASUREMENT. #166 asks for it to be set from a week
      # of staging data; no such week exists yet. 20 lines in 5 minutes is "more than one error
      # every 15 seconds, sustained" -- comfortably above the ones and twos a handful of
      # requests a minute produces, and far below a crash-loop or a broken deploy. It must be
      # revisited from real data before it is trusted: docs/monitoring.md, "Tune or delete".
      #
      # `for: 2m` (#54): a count sitting right at 20 crossed it and fell back on alternate
      # evaluations, a firing/resolved pair each time. Two minutes over the line is still a
      # spike. `fatal` counts too: Pino writes a crash at that level, and a rule that matched
      # only `error` would have missed exactly the lines that matter most.
      - uid: booking-error-rate
        title: Booking backend error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum by (host, container) (count_over_time({compose_service="booking-be", level=~"error|fatal"} [5m]))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [20]}
        # No error lines means no series, which is the healthy state -- not an outage. A backend
        # that has stopped logging entirely is container-down-bpvps2's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          app: booking
          severity: warning
        annotations:
          summary: "Booking backend errors on {{ $labels.container }}"
          value: '{{ printf "%.0f" $values.A.Value }} error lines in 5 minutes'
          action: 'Explore -> grafanacloud-logs: `{container="{{ $labels.container }}", level=~"error|fatal"} | json`'
          description: >-
            More errors than a healthy instance produces. A deploy in the last few minutes is
            the usual cause. Group by `requestId`, then `tenantId` (an id, never a studio's name).

      # ── 2. Stripe webhook failure ────────────────────────────────────────────────────────
      # ANY error line from the Stripe webhook route, which sets webhook=stripe on its log
      # context for the whole request (be/src/routes/webhooks/stripe.ts). A failed webhook is
      # money: a payment Stripe believes it delivered and the booking system never recorded.
      # Hence > 0 rather than a rate, and `critical` rather than `warning`.
      #
      # `| json | webhook="stripe"` and not a bare line filter: `webhook` is a FIELD in the JSON
      # line, never a stream label -- nothing but `level` is (config.alloy).
      - uid: booking-stripe-webhook-failed
        title: Booking Stripe webhook failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum by (host, container) (count_over_time({compose_service="booking-be", level="error"} | json | webhook="stripe" [5m]))
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # Silence here is the healthy state: no failing webhook, no line, no series.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          app: booking
          severity: critical
        annotations:
          summary: "Booking Stripe webhook on {{ $labels.container }}"
          value: '{{ printf "%.0f" $values.A.Value }} failed in 5 minutes'
          action: 'Explore: `{container="{{ $labels.container }}", level="error"} | json | webhook="stripe"` gives the eventId'
          description: >-
            Stripe delivered an event the backend did not record: a payment, refund or
            subscription change may be missing. Fix the handler, then replay it from Stripe.

  # ── 3. API down is NOT here. ───────────────────────────────────────────────────────────────
  # grafana/rules/endpoints.yml's `endpoint-down-2m` already covers it: a Grafana probe in
  # Singapore requests api.dev.reservetoday.app and api.reservetoday.app every two minutes --
  # both names are derived from bpvps2's Traefik routers, so the checks exist without anyone
  # listing them -- and the rule fires when the probe has failed at least two runs in a row.
  # That is #166's "the backend synthetic check failing twice in a row", already written. It is
  # the FAST cadence for that reason: #42 moved every other public name to fifteen minutes to
  # stay inside the free tier, and kept these two at two, which puts a phone at roughly six to
  # seven minutes rather than #24's measured 2m37s. A second rule over the same probe_success
  # series would be two Discord messages for one outage and two thresholds to keep in step.
  #
  # What WAS missing is what the probe asked for. It requested `/`, which answers 200 from Hono
  # without touching Postgres, so a backend with a dead database read as healthy. Both names now
  # carry `path: /health` in grafana/synthetic/endpoints.yml -- that route runs `SELECT 1` and
  # answers 503 when the database is unreachable, so the existing rule now covers a dead database
  # too. One consequence, written down rather than discovered at 2am: `endpoint-down-2m` is an INFRA
  # rule with no `app` label, so a booking API outage arrives in the infra channel, not the
  # booking one. docs/monitoring.md says so under "Where an alert lands".

  # ── 4. Job did not run ─────────────────────────────────────────────────────────────────────
  - orgId: 1
    name: booking-jobs
    folder: Apps
    # ── A 2-hour window, not 25 (#54) ──────────────────────────────────────────────────────
    # Both jobs log `cron job ok` every 15 minutes -- 8 lines in any 2 hours, 96 a day, on
    # each instance (measured 2026-11-11). The window was 25 hours on the belief that they ran
    # daily, so a dead scheduler took a day to notice; now it takes two hours and still
    # tolerates seven missed runs in a row.
    #
    # ── One cause, one alert ───────────────────────────────────────────────────────────────
    # When Loki refuses logs the lines stop ARRIVING, not being written, and all four rules
    # fired for eleven days in October 2026 over a scheduler that was fine. So each rule also
    # reads B from the usage datasource -- which does not depend on Loki: 1 when the month's
    # allowance is spent (usage at 98% of the included figure or more), else 0. A rule fires
    # only when no line arrived AND the allowance is not spent. While it is spent these are
    # blind and say nothing; logs-dropped is the one alert, and its message says so.
    #
    # B is the ALLOWANCE, deliberately not "were any bytes refused in the window". A spent
    # allowance refuses everything until the 1st, which is the case to stand down for. A
    # short burst over the per-second limit refuses a few lines from whichever stream burst --
    # and a gate that closed on any refused byte would let one noisy collector blind all four
    # heartbeats for two hours at a time, indefinitely. If the usage figure cannot be read,
    # `or vector(0)` leaves the gate open and the heartbeat alerts as if it were not there.
    # The four copies of B must stay identical; scripts/test_grafana_apply.py checks that.
    #
    # 5m, not 1m: a heartbeat that may be two hours old does not need minute resolution.
    interval: 5m
    rules:
      - uid: bk-job-expirePackages-stg
        title: Booking job expirePackages not running (staging)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum(count_over_time({container="booking-be-staging"} |= "cron job ok" | json | job="expirePackages" [2h])) or vector(0)
          # B: is the logs allowance spent? (See "One cause, one alert" above the group.)
          - refId: B
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: B
              instant: true
              range: false
              expr: (max(grafanacloud_org_logs_usage) >= bool 0.98 * max(grafanacloud_org_logs_included_usage)) or vector(0)
          - refId: C
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: "$A < 1 && $B < 1"
        # See the file header: a Loki count over nothing returns NO SERIES, and Grafana reads
        # that as No Data, not as zero. `or vector(0)` makes the zero real; this makes even a
        # missing frame speak.
        noDataState: Alerting
        execErrState: Error
        # Three evaluations: this rides out one bad query.
        for: 15m
        labels:
          app: booking
          severity: warning
          # Written on the rule, not taken from the query: the firing instance may be the
          # `vector(0)` branch or a No Data instance, and neither carries the stream's labels.
          host: bpvps2
        annotations:
          summary: 'Booking job "expirePackages" on booking-be-staging'
          value: "no `cron job ok` line in 2 hours"
          action: "`ssh bp-bpvps2 'docker ps --filter name=booking-be-staging; docker logs --tail 200 booking-be-staging | grep -i cron'`"
          description: >-
            Nothing this job does (expires packages whose term has run out) has happened for any
            Tenant for two hours. A scheduler heartbeat, not proof of any one Tenant's run.

      - uid: bk-job-sendLapsingAlerts-stg
        title: Booking job sendLapsingAlerts not running (staging)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum(count_over_time({container="booking-be-staging"} |= "cron job ok" | json | job="sendLapsingAlerts" [2h])) or vector(0)
          # B: is the logs allowance spent? (See "One cause, one alert" above the group.)
          - refId: B
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: B
              instant: true
              range: false
              expr: (max(grafanacloud_org_logs_usage) >= bool 0.98 * max(grafanacloud_org_logs_included_usage)) or vector(0)
          - refId: C
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: "$A < 1 && $B < 1"
        # See the file header: a Loki count over nothing returns NO SERIES, and Grafana reads
        # that as No Data, not as zero. `or vector(0)` makes the zero real; this makes even a
        # missing frame speak.
        noDataState: Alerting
        execErrState: Error
        # Three evaluations: this rides out one bad query.
        for: 15m
        labels:
          app: booking
          severity: warning
          # Written on the rule, not taken from the query: the firing instance may be the
          # `vector(0)` branch or a No Data instance, and neither carries the stream's labels.
          host: bpvps2
        annotations:
          summary: 'Booking job "sendLapsingAlerts" on booking-be-staging'
          value: "no `cron job ok` line in 2 hours"
          action: "`ssh bp-bpvps2 'docker ps --filter name=booking-be-staging; docker logs --tail 200 booking-be-staging | grep -i cron'`"
          description: >-
            Nothing this job does (warns clients whose packages are about to lapse) has happened
            for any Tenant for two hours. A scheduler heartbeat, not proof of any one Tenant's run.

      - uid: bk-job-expirePackages-prd
        title: Booking job expirePackages not running (prod)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum(count_over_time({container="booking-be-prod"} |= "cron job ok" | json | job="expirePackages" [2h])) or vector(0)
          # B: is the logs allowance spent? (See "One cause, one alert" above the group.)
          - refId: B
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: B
              instant: true
              range: false
              expr: (max(grafanacloud_org_logs_usage) >= bool 0.98 * max(grafanacloud_org_logs_included_usage)) or vector(0)
          - refId: C
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: "$A < 1 && $B < 1"
        # See the file header: a Loki count over nothing returns NO SERIES, and Grafana reads
        # that as No Data, not as zero. `or vector(0)` makes the zero real; this makes even a
        # missing frame speak.
        noDataState: Alerting
        execErrState: Error
        # Three evaluations: this rides out one bad query.
        for: 15m
        labels:
          app: booking
          severity: warning
          # Written on the rule, not taken from the query: the firing instance may be the
          # `vector(0)` branch or a No Data instance, and neither carries the stream's labels.
          host: bpvps2
        annotations:
          summary: 'Booking job "expirePackages" on booking-be-prod'
          value: "no `cron job ok` line in 2 hours"
          action: "`ssh bp-bpvps2 'docker ps --filter name=booking-be-prod; docker logs --tail 200 booking-be-prod | grep -i cron'`"
          description: >-
            Nothing this job does (expires packages whose term has run out) has happened for any
            Tenant for two hours. A scheduler heartbeat, not proof of any one Tenant's run.

      - uid: bk-job-sendLapsingAlerts-prd
        title: Booking job sendLapsingAlerts not running (prod)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-logs
            model:
              refId: A
              queryType: instant
              expr: |
                sum(count_over_time({container="booking-be-prod"} |= "cron job ok" | json | job="sendLapsingAlerts" [2h])) or vector(0)
          # B: is the logs allowance spent? (See "One cause, one alert" above the group.)
          - refId: B
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: grafanacloud-usage
            model:
              refId: B
              instant: true
              range: false
              expr: (max(grafanacloud_org_logs_usage) >= bool 0.98 * max(grafanacloud_org_logs_included_usage)) or vector(0)
          - refId: C
