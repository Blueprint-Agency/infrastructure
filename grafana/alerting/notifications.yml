# Where alerts go, and what they look like when they arrive.
#
# Applied by scripts/grafana-apply.py like the dashboards and rules next door: this file is
# the copy of record. Editing a contact point or the policy tree in the web UI works until
# the next apply overwrites it.
#
# ${VAR} is substituted from the environment at apply time and must be set -- an unset one
# fails the run, the same rule as render-ci.py. This repository is PUBLIC: a Discord webhook
# URL is a credential (anyone holding it can post to the channel), so it lives in .env and
# never here.
#
# One alerting path, by decision (#22): no second alerting vendor, no Telegram/ntfy/Pushover.
# Discord is a Grafana-native contact point, so Grafana still owns routing, grouping and
# silences -- Discord is only delivery, the same as email. A SECOND Discord channel is a second
# address on that same integration, not a second vendor: still one policy tree, one set of
# silences, one template. Why per-app channels are the documented shape, with citations:
# docs/research/grafana-multi-app-alert-routing.md.
#
# Adding an app: a webhook, a contact point beside `discord-booking`, one route block at the top
# of the tree, and rules labelled `app: <name>`. Nothing else. docs/grafana-organization.md.
#
# ⚠️ Discord will not reliably wake anyone at 2am: phone Do Not Disturb silences it. Set that
# server to "All Messages" and add it to the DND exceptions, or accept that overnight
# criticals are seen in the morning. That trade was made knowingly; email is not configured
# yet, and when it is, `critical` should gain an email integration beside the Discord one.

contact_points:
  - name: discord
    type: discord
    # &discord_format is a YAML anchor: every other Discord contact point merges it and
    # overrides only `url`, so one channel can never drift into a different message format.
    settings: &discord_format
      url: ${DISCORD_WEBHOOK_URL}

      # Default Discord formatting dumps every label and annotation of every instance -- a wall
      # nobody reads on a phone. So: one line per alert, one line of what to do, and the STATE
      # said in words. Sources: docs/research/grafana-discord-alert-format.md.
      #
      # Grafana re-renders a rule's annotations when it resolves, so a summary written as "X is
      # broken" arrives under a green dot still saying it is broken. Hence the split every rule
      # follows: `summary` names WHAT is checked and reads right in both states; `value` says
      # what is wrong and is printed only under Firing. The template supplies the state.
      #
      # Every rule carries a third annotation, `action` (#54): the first thing to do, in 120
      # characters or fewer, printed as "Do:". The description is the fallback and the runbook
      # holds the rest -- a paragraph in an alert is a paragraph nobody reads at 2am.
      # scripts/test_grafana_apply.py fails a rule without one, or with a long one.
      #
      # One message is one HOST's incident (the policy groups by folder and host), so it can
      # carry several rules. "Do:" is printed after the first alert of each run that shares it,
      # not once per alert: eight containers down is one instruction, not eight.
      #
      # The dot is the severity: red critical, orange warning, blue info. Each severity has its
      # own route, so one message never mixes them. No severity at all (a typo, a rule that
      # forgot it) is shown red and called ALERT.
      #
      # A rule that could not be evaluated is NOT the thing it watches being broken. Grafana
      # sends those as `DatasourceNoData` / `DatasourceError` with the rule's name in
      # `rulename` and the rule's annotations rendered against nothing -- which used to print
      # "` on : failing from every probe`", an outage that had not happened. They get their own
      # line, which says it is the check.
      #
      # One notification can carry firing AND resolved alerts, and Discord colours the whole
      # card red if any one fires -- so they are two labelled lists, never one mixed list.
      # Ten lines at most per list: Discord cuts an embed at 4,096 characters, mid-word.
      #
      # "Silence all" opens the silence form filled in with the GROUP's labels (folder, host,
      # severity, and the rule if there is only one), so one click quiets the whole message.
      # Grafana's own per-alert link silenced one alert of eight. The form still asks for an
      # end time: give it one (docs/monitoring.md, "Silencing").
      # The link is only offered when it is NARROW: the group has a host, or every alert in it
      # is one rule. The account-wide budget rules carry no host, and a message holding two of
      # them would otherwise build a silence on folder + severity alone -- every warning on
      # both hosts, until the 1st. That message gets Grafana's per-alert link instead, named
      # for what it does. The base URL has its trailing slash trimmed, so a root_url written
      # either way gives one slash.
      #
      # Message inside the coloured card (grafana/alerting#368, "Show Message in Embed" in the
      # UI). Cost: @mentions stop pinging, and none are sent. On a build without it, the key is
      # ignored and the message sits above the card, as before.
      use_embed_description: true

      title: >-
        {{- $name := .CommonLabels.alertname -}}
        {{- if eq $name "DatasourceNoData" }}{{ $name = "No data" }}{{ end -}}
        {{- if eq $name "DatasourceError" }}{{ $name = "Query error" }}{{ end -}}
        {{- if .Alerts.Firing -}}
        {{- if eq .CommonLabels.severity "critical" }}🔴 CRITICAL
        {{- else if eq .CommonLabels.severity "warning" }}🟠 WARNING
        {{- else if eq .CommonLabels.severity "info" }}🔵 INFO
        {{- else }}🔴 ALERT{{ end }}
        {{- else -}}
        ✅ RESOLVED
        {{- end }} · {{ if $name }}{{ $name }}{{ with .CommonLabels.rulename }}: {{ . }}{{ end }}{{ else }}{{ with .GroupLabels.host }}{{ . }}{{ else }}several alerts{{ end }}{{ end }}
        {{- if gt (len .Alerts.Firing) 1 }} · {{ len .Alerts.Firing }} firing{{ end }}
        {{- if and .Alerts.Firing .Alerts.Resolved }} · {{ len .Alerts.Resolved }} cleared{{ end }}

      # Labels are omitted on purpose: every summary already names its container and host.
      message: |-
        {{- if .Alerts.Firing -}}
        **Firing**
        {{- $do := "" }}
        {{- range $i, $a := .Alerts.Firing }}
        {{- if lt $i 10 }}
        {{- $since := $a.StartsAt | tz "Asia/Kuala_Lumpur" | date "02 Jan 15:04" }}
        {{- if eq $a.Labels.alertname "DatasourceNoData" }}
        • {{ $a.Labels.rulename }}: **no data** · since {{ $since }}
        > The check returned nothing. That is the check itself, not the service it watches.
        {{- else if eq $a.Labels.alertname "DatasourceError" }}
        • {{ $a.Labels.rulename }}: **query error** · since {{ $since }}
        > The check could not run. That is the check itself, not the service it watches.
        {{- else }}
        • {{ $a.Annotations.summary }}{{ with $a.Annotations.value }}: **{{ . }}**{{ end }} · since {{ $since }}
        {{- $next := or $a.Annotations.action $a.Annotations.description }}
        {{- if and $next (ne $next $do) }}
        > Do: {{ $next }}
        {{- $do = $next }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if gt (len .Alerts.Firing) 10 }}
        • and more: {{ len .Alerts.Firing }} firing in all
        {{- end }}

        [Runbook]({{ with index .Alerts.Firing 0 }}{{ with .Annotations.runbook_url }}{{ . }}{{ else }}https://github.com/Blueprint-Agency/infrastructure/blob/main/docs/monitoring.md#what-each-alert-means-and-the-first-three-things-to-check{{ end }}{{ end }}) · {{ if or .GroupLabels.host .CommonLabels.alertname }}[Silence all]({{ reReplaceAll "/+$" "" .ExternalURL }}/alerting/silence/new?alertmanager=grafana{{ range .GroupLabels.SortedPairs }}{{ if .Value }}&matcher={{ .Name | urlquery }}%3D{{ .Value | urlquery }}{{ end }}{{ end }}{{ with .CommonLabels.severity }}&matcher=severity%3D{{ . | urlquery }}{{ end }}{{ with .CommonLabels.alertname }}&matcher=alertname%3D{{ . | urlquery }}{{ end }}){{ else }}[Silence the first]({{ (index .Alerts.Firing 0).SilenceURL }}){{ end }}
        {{- end }}
        {{- if .Alerts.Resolved }}
        {{ if .Alerts.Firing }}
        {{ end }}**Resolved**
        {{- range $i, $a := .Alerts.Resolved }}
        {{- if lt $i 10 }}
        • {{ with $a.Labels.rulename }}{{ . }} (the check itself){{ else }}{{ $a.Annotations.summary }}{{ end }} · {{ $a.StartsAt | tz "Asia/Kuala_Lumpur" | date "02 Jan 15:04" }} → {{ $a.EndsAt | tz "Asia/Kuala_Lumpur" | date "02 Jan 15:04" }}
        {{- end }}
        {{- end }}
        {{- if gt (len .Alerts.Resolved) 10 }}
        • and more: {{ len .Alerts.Resolved }} resolved in all
        {{- end }}
        {{- end }}

  # booking-system's own alerts (Blueprint-Agency/booking-system#166), in their own channel so a
  # deploy-time application alert does not bury a host running out of disk. Same format, same
  # tree, same silences -- only the webhook differs.
  - name: discord-booking
    type: discord
    settings:
      <<: *discord_format
      url: ${DISCORD_BOOKING_WEBHOOK_URL}

# How long a tier waits before it speaks, written once and merged into both the infra routes and
# every app's. grafana-apply.py reads only `contact_points` and `policy`, so this block is not a
# third section of the file -- it exists purely to be anchored below. An app that quietly inherited Grafana's defaults instead (30s/5m/4h) would page
# slower than the infra rules for the same severity word, and nobody would notice until it did.
severity_timings:
  # 10s, not the 30s default. grafana/rules/endpoints.yml is timed around it, and #24's
  # acceptance test is "Traefik stopped -> alert on a phone within five minutes".
  #
  # Repeats are REMINDERS, not the alert (#54): a critical still firing is said again every 4
  # hours, a warning once a day. At 1 h a critical that could not be fixed until the 1st of the
  # month was said ~165 times. A condition that is known and has to wait gets a silence with an
  # end date, not a muted phone (docs/monitoring.md, "Silencing").
  critical: &critical_timing
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
  warning: &warning_timing
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 24h
  # info is the textfile canary, which is MEANT to fire during the seam test. It must never
  # be urgent: slow first send, and a day between repeats.
  info: &info_timing
    group_wait: 5m
    group_interval: 30m
    repeat_interval: 24h

# The routing tree. `group_by` is folder and HOST, and no longer the rule's name (#54): one
# incident on one host is one message that updates, where a dead host used to be about six
# separate ones. bpvps1 and bpvps2 still never share a message -- two incidents, usually two
# causes -- and each severity is its own route, so a warning never rides in a critical's
# message. Accepted cost: an unrelated alert of the same severity on the same host joins the
# open message instead of starting its own; the title's count goes up and the line is added.
# Children inherit the grouping; an alert carrying no `host` (the account-wide budget rules)
# groups under the empty value, which is what we want, and `grafana_folder` keeps the Apps
# folder's alerts out of Monitoring's groups.
#
# The root carries the critical timings itself. An alert with no severity, or a misspelled one,
# matches no child and is delivered by the root -- which without timings of its own would use
# Grafana's defaults (30s / 5m / 4h), a third behaviour nobody chose. Loud is the safe way to
# be wrong. scripts/test_grafana_apply.py also fails a rule whose severity has no route.
#
# ⚠️ ORDER IS LOAD-BEARING. Matching stops at the first matching child (Grafana: "Once a matching
# policy is found, the system does not continue to look for sibling policies"; Alertmanager:
# depth-first, left-to-right, `continue` false by default). Every app alert also carries a
# `severity`, so an app route placed BELOW the severity routes would never be reached and its
# channel would stay silent. App routes first, severity nested under each -- which is also the
# documented ordering, most specific first. Sources: docs/research/grafana-multi-app-alert-routing.md.
policy:
  receiver: discord
  group_by: [grafana_folder, host]
  <<: *critical_timing
  routes:
    # ── Apps. One block each, matching the `app` label the rules carry. ────────────────────
    # The label is the contract, not the folder: a rule filed anywhere reaches this channel if
    # and only if it sets `app: booking`. A booking rule that forgets it falls through to the
    # infra severity routes below and arrives in the infra channel -- wrong room, not silence.
    # grafana/rules/booking.yml is separate work; this route exists ahead of it.
    - receiver: discord-booking
      matchers: [[app, "=", booking]]
      routes:
        - {receiver: discord-booking, matchers: [[severity, "=", critical]], <<: *critical_timing}
        - {receiver: discord-booking, matchers: [[severity, "=", warning]], <<: *warning_timing}
        - {receiver: discord-booking, matchers: [[severity, "=", info]], <<: *info_timing}

    # ── Infrastructure: everything with no `app` label. ───────────────────────────────────
    - receiver: discord
      matchers: [[severity, "=", critical]]
      <<: *critical_timing

    - receiver: discord
      matchers: [[severity, "=", warning]]
      <<: *warning_timing

    - receiver: discord
      matchers: [[severity, "=", info]]
      <<: *info_timing
