name: Deploy Infrastructure Stacks

# Repo is source of truth for all stacks, on ALL hosts listed in vps/hosts.json.
# On push to main:
#   - Stack folder present + changed  → deploy / update on the host
#   - Stack folder deleted from repo  → docker compose down + remove from the host
#
# Per-host behaviour lives in vps/hosts.json, not here:
#   exclude     stacks skipped entirely (managed by their own repo CI/CD)
#   app_stacks  compose is rsynced, but `docker compose up` is the app repo's job
#   fanout      one repo stack dir → several host stack dirs (bpvps2's booking)
#
# Per-STACK secret files live next to the stack, not here:
#   vps/<host>/stacks/<stack>/ci/   templates with @@MARKER@@ placeholders,
#                                   rendered by vps/shared/render-ci.py
# This workflow knows nothing about any individual stack. Onboarding one means
# adding files under its ci/ -- never editing this file. See CLAUDE.md → CI/CD.
#
# Each host needs a GitHub Environment named after its `key`, holding at minimum
# TAILSCALE_HOST. BASE_DOMAIN / ACME_EMAIL / CF_DNS_API_TOKEN are org-level;
# override them per Environment where a host differs (bpvps1 → kaiteki.my).

on:
  push:
    branches: [main]
    paths:
      - 'vps/**'
      - '.github/workflows/deploy-infra.yml'
      # Not deployed, but checked: a registry domain or a rule change must still fail the
      # monitoring drift job. Such a push selects no host, so only that job runs.
      - 'apps/registry.yml'
      - 'grafana/**'
      - 'scripts/grafana-apply.py'
      - 'scripts/test_grafana_apply.py'
      - 'scripts/test_probes_lib.sh'

jobs:
  # ── Monitoring agrees with itself — runs on every push, host selected or not ─
  # Every allowlisted metric backs a panel or rule under grafana/, every metric a panel or rule
  # reads is allowlisted, and each monitored host's container-down rule names exactly the
  # containers its compose files define. Every public name a router serves on an in-scope host
  # gets an external check, and every registry domain is one of them (#24). Then the
  # grafana-apply translation, and every Alloy config validated against its pinned tag.
  monitoring-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check monitoring allowlist, endpoints, dashboards, rules and agent config
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 vps/shared/test_check_monitoring.py
          bash scripts/test_probes_lib.sh
          python3 vps/shared/test_public_endpoints.py
          python3 scripts/test_grafana_apply.py
          bash vps/shared/validate-alloy.sh

  # ── Map changed paths → host entries from vps/hosts.json ─────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.out.outputs.hosts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: out
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          printf '%s\n' "$DIFF" > /tmp/diff.txt
          HOSTS=$(python3 vps/shared/select-hosts.py /tmp/diff.txt)
          echo "hosts=$HOSTS" >> $GITHUB_OUTPUT
          echo "Selected: $HOSTS"

  # ── One job, fanned out over the hosts detect selected ───────────────────────
  deploy:
    # A drift failure blocks every host's deploy, as it did when it was a step here.
    needs: [detect, monitoring-drift]
    if: needs.detect.outputs.hosts != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.host.key }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.detect.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Self-check the template renderer
        run: python3 vps/shared/test_render_ci.py

      # Covers only the pure parsing half of verify-mail.sh -- no DNS, SMTP or TLS is
      # touched, so this is safe to run on every deploy.
      - name: Self-check the mail verification checks
        run: bash scripts/test_verify_mail.sh

      # Sources the declarations in bpvps1's renew-cert.sh and asserts the certificate name
      # list -- above all that the primary name still comes first, because acme.sh keys its
      # state directory on it and a reorder expires the cert silently 90 days later.
      - name: Self-check the mail certificate name list
        run: bash scripts/test_renew_cert.sh

      # The pure half of the backup job: the targets file parser, the floor-size guard, the
      # heartbeat metric, the healthcheck, the RLS dump-role guard, the restore drill's
      # row-count comparison, the restore-to-live confirmation and the export log line.
      # Needs yq, which the runner image ships.
      - name: Self-check the backup job helpers
        run: bash scripts/test_backup_lib.sh

      # Weekly-backup freshness, "no snapshot" read from Hostinger's id 0, and the action poll
      # that must end on success. No request is made.
      - name: Self-check the hypervisor backup checks
        run: python3 scripts/test_hypervisor_backups.py

      # Every in-scope host in vps/hosts.json has a backup targets.yml, and every named volume
      # in its compose files is backed up or skipped with a reason. A host declared
      # no_backups: <reason> is exempt and must carry no targets file. This is what stops
      # backup coverage from rotting as stacks change. PyYAML is python3-yaml on the runner.
      - name: Check backup targets cover every volume
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 vps/shared/test_check_backup_targets.py

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Detect stacks to deploy and remove
        id: stacks
        env:
          DIR: ${{ matrix.host.dir }}
          EXCLUDE: ${{ matrix.host.exclude }}
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          EXPR=$(echo "$EXCLUDE" | tr ' ' '|')
          [ -z "$EXPR" ] && EXPR='^$'
          ALL_TOUCHED=$(echo "$DIFF" | grep "^$DIR/stacks/" \
            | sed "s|$DIR/stacks/||;s|/.*||" | sort -u \
            | grep -vxE "$EXPR" || true)
          DEPLOY="" REMOVE=""
          for stack in $ALL_TOUCHED; do
            if [ -d "$DIR/stacks/$stack" ]; then DEPLOY="$DEPLOY $stack"; else REMOVE="$REMOVE $stack"; fi
          done
          echo "deploy=$(echo $DEPLOY | xargs)" >> $GITHUB_OUTPUT
          echo "remove=$(echo $REMOVE | xargs)" >> $GITHUB_OUTPUT
          echo "Deploy: $DEPLOY | Remove: $REMOVE"

      - name: Sync and deploy
        if: steps.stacks.outputs.deploy != '' || steps.stacks.outputs.remove != ''
        env:
          DIR: ${{ matrix.host.dir }}
          SSH_HOST: ${{ vars.TAILSCALE_HOST }}
          ENV_NAME: ${{ matrix.host.env_name }}
          FANOUT: ${{ toJSON(matrix.host.fanout) }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
          REMOVE: ${{ steps.stacks.outputs.remove }}
          # Written into every stack's .env (CI-owned keys; see the merge below).
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          # Consumed only by @@MARKER@@s inside some stack's ci/ templates. Adding a
          # stack that needs a new secret means adding a line here and a template
          # there -- render-ci.py fails the deploy if a marker has no value.
          GATEWAY_MASTERPASS: ${{ secrets.GATEWAY_MASTERPASS }}
          GA4_MCP_PATH_TOKEN: ${{ secrets.GA4_MCP_PATH_TOKEN }}
          GA4_MCP_SA_KEY_JSON: ${{ secrets.GA4_MCP_SA_KEY_JSON }}
          GA4_MCP_PROJECT_ID: ${{ vars.GA4_MCP_PROJECT_ID }}
          GSC_MCP_PATH_TOKEN: ${{ secrets.GSC_MCP_PATH_TOKEN }}
          GSC_MCP_SA_KEY_JSON: ${{ secrets.GSC_MCP_SA_KEY_JSON }}
          MCP_DEX_ADMIN_HASH: ${{ secrets.MCP_DEX_ADMIN_HASH }}
          MCP_DEX_ADMIN_EMAIL: ${{ vars.MCP_DEX_ADMIN_EMAIL }}
          N8N_DB_USER: ${{ vars.N8N_DB_USER }}
          N8N_DB_PASSWORD: ${{ secrets.N8N_DB_PASSWORD }}
          N8N_DB_NAME: ${{ vars.N8N_DB_NAME }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_EDITOR_BASE_URL: ${{ vars.N8N_EDITOR_BASE_URL }}
          N8N_WEBHOOK_URL: ${{ vars.N8N_WEBHOOK_URL }}
          WABA_DB_USER: ${{ vars.WABA_DB_USER }}
          WABA_DB_PASSWORD: ${{ secrets.WABA_DB_PASSWORD }}
          WABA_DB_NAME: ${{ vars.WABA_DB_NAME }}
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          GRAFANA_CLOUD_PROM_URL: ${{ vars.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ vars.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ vars.GRAFANA_CLOUD_LOKI_USER }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          DB_O11Y_STAGING_PASSWORD: ${{ secrets.DB_O11Y_STAGING_PASSWORD }}
          DB_O11Y_PROD_PASSWORD: ${{ secrets.DB_O11Y_PROD_PASSWORD }}
        run: |
          RSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"

          # Expand stack names into dir|env_name|stack targets. dir == stack everywhere
          # except bpvps2's booking: one repo stack deployed into two host dirs, each
          # carrying its own env_name.
          TARGETS=$(python3 vps/shared/expand-targets.py $DEPLOY | tr '\n' ' ')
          REMOVE_TARGETS=$(python3 vps/shared/expand-targets.py $REMOVE | tr '\n' ' ')
          echo "Targets: $TARGETS"
          echo "Remove:  $REMOVE_TARGETS"

          # ── Push compose files, then the stack's own CI-rendered secret files ──
          # ci/ is excluded from the first rsync so raw @@MARKER@@ templates never
          # land on a host; render-ci.py fills them in here, where the secrets are.
          for target in $TARGETS; do
            d="${target%%|*}"; stack="${target##*|}"
            echo "=== syncing $stack -> /root/stacks/$d"
            rsync -rltz --exclude='.env' --exclude='.env.*' --exclude='ci/' -e "$RSH" \
              "$DIR/stacks/$stack/" "deploy@$SSH_HOST:/root/stacks/$d/"

            RENDERED=$(mktemp -d)
            python3 vps/shared/render-ci.py "$DIR/stacks/$stack" "$RENDERED"
            if [ -n "$(ls -A "$RENDERED")" ]; then
              rsync -rltz -e "$RSH" "$RENDERED/" "deploy@$SSH_HOST:/root/stacks/$d/"
            fi
            rm -rf "$RENDERED"
          done

          # $ in a bcrypt hash would otherwise be eaten by compose's interpolation.
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          # Host-wide .env keys. ENV_NAME is deliberately NOT here: it is appended
          # per target, because a fanout stack's destinations each carry their own.
          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" | base64 -w0)

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "deploy@$SSH_HOST" "
          set -e
          TARGETS='$TARGETS'
          REMOVE_TARGETS='$REMOVE_TARGETS'
          BASE_ENV='$BASE_ENV'

          # App-managed stacks: infra rsyncs the compose file but the app's own
          # workflow writes its images and runs 'docker compose up'. Skip the up here.
          APP_STACKS='${{ matrix.host.app_stacks }}'

          for target in \$TARGETS; do
            dir=\$(echo \"\$target\" | cut -d'|' -f1)
            env_name=\$(echo \"\$target\" | cut -d'|' -f2)
            stack=\$(echo \"\$target\" | cut -d'|' -f3)
            echo '=== Deploying '\$stack' -> /root/stacks/'\$dir' (ENV_NAME='\$env_name') ==='
            mkdir -p /root/stacks/\$dir
            cd /root/stacks/\$dir

            # MERGE, never replace. Stacks carry host-managed keys CI knows nothing
            # about (stalwart's mail secrets, booking's BOOKING_HOST/IMAGE_TAG).
            # CI-owned keys win; every other line, comments included, is preserved.
            # env.ci is the stack's own contribution, rendered from ci/env.ci.
            NEW_ENV=\$(mktemp); KEPT=\$(mktemp)
            { echo \"\$BASE_ENV\" | base64 -d
              echo \"ENV_NAME=\$env_name\"
              if [ -f env.ci ]; then cat env.ci; fi
            } > \$NEW_ENV
            rm -f env.ci
            if [ -f .env ]; then
              awk -F= 'NR==FNR { if (\$0 ~ /^[A-Za-z_][A-Za-z0-9_]*=/) { split(\$0,a,\"=\"); k[a[1]]=1 } next }
                       /^[A-Za-z_][A-Za-z0-9_]*=/ { split(\$0,a,\"=\"); if (a[1] in k) next }
                       { print }' \$NEW_ENV .env > \$KEPT
              cat \$NEW_ENV \$KEPT > .env
            else
              cp \$NEW_ENV .env
            fi
            rm -f \$NEW_ENV \$KEPT

            if echo \" \$APP_STACKS \" | grep -q \" \$dir \"; then
              echo \"=== \$dir compose synced; up handled by app workflow ===\"
              continue
            fi

            # Optional per-stack hook (mkdir/chmod/chown a stack needs before it can
            # start). Replaces the 'case \$stack in' block this workflow used to carry.
            if [ -f post-sync.sh ]; then
              echo '--- post-sync.sh'
              bash post-sync.sh
            fi

            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== '\$dir' done ==='
          done

          for target in \$REMOVE_TARGETS; do
            dir=\$(echo \"\$target\" | cut -d'|' -f1)
            echo '=== Removing '\$dir' ==='
            if [ -d /root/stacks/\$dir ]; then
              cd /root/stacks/\$dir && docker compose down --remove-orphans
              rm -rf /root/stacks/\$dir
            fi
            echo '=== '\$dir' removed ==='
          done
          "
