# What vps3-prod backs up -- nothing yet. The backup stack lands on this host in #28; until
# then this file only accounts for every named volume, so none can be missed when it does.
# `backup` is in this host's `exclude` in vps/hosts.json until a compose file sits beside it.
#
# Format and kinds: vps/bpvps2/stacks/backup/targets.yml. Checked in CI by
# vps/shared/check-backup-targets.py.

targets: []

skip:
  - volume: ehailing_pgdata
    reason: NOT BACKED UP yet -- ehailing production database, a postgres target in #28.
  - volume: n8n_pgdata
    reason: >-
      NOT BACKED UP yet -- n8n's database, a postgres target in #28. Must be restored
      together with n8n-data, which holds the key its credentials are encrypted with.
  - volume: n8n-data
    reason: NOT BACKED UP yet -- n8n data and its encryption key, a volume target in #28.
  - volume: n8n_waba_pgdata
    reason: NOT BACKED UP yet -- the WABA database, a postgres target in #28.
  - volume: drizzle-gateway-data
    reason: NOT BACKED UP yet -- drizzle-gateway state, a volume target in #28.
  - volume: ehailing_redisdata
    reason: >-
      ehailing's Redis; not in #4's data table. #28 to confirm it holds nothing the app
      does not rebuild.
  - volume: infra_traefik-letsencrypt
    reason: NOT BACKED UP yet -- issued certificates, re-issued if lost. Captured in #28.
