# booking-system — multi-tenant booking & management platform (Hono BE + Postgres).
#
# ONE deployment serves every studio. A studio is a Tenant row in `tenants`, never
# its own stack, container or database — do not add a stack per customer. Row-Level
# Security in Postgres is the backstop, and it only works if booking-be connects as
# the non-owning `booking_app` role via DATABASE_APP_URL (owners bypass RLS).
#
# ONE file, deployed TWICE on bpvps2 — /root/stacks/booking-staging and
# /root/stacks/booking-prod. Everything that would collide between the two
# instances is keyed off ${ENV_NAME}, so the stacks share nothing but Traefik:
#   containers  booking-be-<env> / booking-db-<env>
#   volume      booking_<env>_pgdata
#   network     booking-<env>-network
#
# The SERVICE name stays `db-booking` in both, so DATABASE_URL is identical
# either side (`postgres://...@db-booking:5432/...`) — service DNS resolves
# per-network, so there is no cross-talk.
#
# Set in each stack's .env:  ENV_NAME=staging|prod  BOOKING_FQDN=<full hostname>
#
# BOOKING_FQDN is a FULL hostname, not a subdomain of the host-wide BASE_DOMAIN
# (teeko.ai) — booking lives on reservetoday.app, which BASE_DOMAIN can't express.

# Log caps (booking-system#166). Docker's json-file driver keeps a container's stdout
# forever unless told otherwise, and a 4 GB host that serves the booking API is not the
# place to find out how big a crash-loop's log gets. 3 x 10 MB per container, on EVERY
# service here. The durable copy is Grafana Cloud Loki -- the monitoring stack's Alloy
# reads these logs through the Docker socket and ships every line -- so what rotation
# drops is only the host-local tail, never the only copy. json-file, not `local`: it is
# the driver every other container on the host already uses (docs/monitoring.md).
# Takes effect when a container is recreated: booking's next deploy does that.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  booking-be:
    # staging branch -> :staging, main branch -> :latest. The deploy workflow
    # writes IMAGE_TAG into this stack's .env, so the file always matches the
    # image CI just pushed.
    image: blueprintagency/booking-be:${IMAGE_TAG}
    pull_policy: always
    container_name: booking-be-${ENV_NAME}
    restart: unless-stopped
    logging: *logging
    env_file: .env.booking-be
    healthcheck:
      # Verifies the API serves AND can reach Postgres. Lets `compose up --wait`
      # in the deploy workflow block until booking-be is truly healthy, and
      # surfaces a crash-loop as "unhealthy" in `docker ps`. node:20-alpine ships
      # a global fetch, so no curl/wget needed in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-booking:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # One hostname. There used to be a second, `BOOKING_FQDN_ALIAS`, so that a
      # rename could overlap — the new name serving a valid certificate before
      # anything was repointed at it, the old name still answering until nothing
      # called it. The api.staging -> api.dev rename it was added for is finished,
      # and both stacks had been carrying it set equal to BOOKING_FQDN, so the rule
      # read `Host(x) || Host(x)`.
      #
      # It is gone rather than left idle because idle was not free: the variable was
      # REQUIRED whether or not a rename was in flight, since an unset one renders
      # Host(``), which Traefik rejects — the router then disappears while TLS still
      # terminates, so the failure looks like a 404 rather than an outage. A
      # mechanism that breaks the site when someone tidies away a duplicate line is
      # worse than writing the second Host() again on the day it is next needed.
      #
      # When that day comes: `Host(a) || Host(b)`, NOT `Host(a, b)`. Traefik v3's
      # Host matcher takes exactly one parameter and rejects the list form with
      # "unexpected number of parameters; got 2, expected one of [1]". Verified the
      # hard way on 2026-08-31, and worth keeping written down.
      - "traefik.http.routers.booking-be-${ENV_NAME}.rule=Host(`${BOOKING_FQDN}`)"
      - "traefik.http.routers.booking-be-${ENV_NAME}.entrypoints=websecure"
      # le-tls, not letsencrypt: booking is on reservetoday.app, whose DNS is served
      # by VERCEL (ns1/ns2.vercel-dns.com) — the Blueprint Cloudflare zone of that
      # name is a staged copy and is not authoritative. The DNS-01 resolver's token
      # only covers teeko.ai regardless. See infra docs/tls-wildcard-constraint.md.
      # Consequence: each hostname above needs its own explicit A record at Vercel
      # (`vercel dns ls reservetoday.app`) pointing at this host, created BEFORE the
      # router asks for a certificate. Vercel serves a `*` ALIAS, so a missing record
      # resolves to Vercel instead of failing — "it resolves" proves nothing.
      - "traefik.http.routers.booking-be-${ENV_NAME}.tls.certresolver=le-tls"
      - "traefik.http.services.booking-be-${ENV_NAME}.loadbalancer.server.port=4000"
    networks:
      - proxy
      - booking-network

  db-booking:
    image: postgres:16-alpine
    container_name: booking-db-${ENV_NAME}
    restart: unless-stopped
    logging: *logging
    # Query-level statistics for Grafana Database Observability (booking-system#166), read
    # by the db-observability stack beside this one. All four are startup settings, so a
    # change here restarts Postgres -- the next booking deploy's `compose up` recreates a
    # container whose command changed, a few seconds of database downtime per instance.
    # The extension and the monitoring role are ONE-TIME SQL per instance, not done here:
    # ../db-observability/setup-db-o11y.sql. pg_stat_statements ships in the image's contrib.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_activity_query_size=4096
    env_file: .env.booking-db
    environment:
      TZ: Asia/Kuala_Lumpur
      PGTZ: Asia/Kuala_Lumpur
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking-network

volumes:
  booking_pgdata:
    name: booking_${ENV_NAME}_pgdata

networks:
  proxy:
    external: true
  booking-network:
    name: booking-${ENV_NAME}-network
    driver: bridge

