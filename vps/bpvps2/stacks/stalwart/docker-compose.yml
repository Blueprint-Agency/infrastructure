# Self-hosted email for blueprintdigital.my — Stalwart mail server + Bulwark (JMAP)
# webmail, co-hosted on BPVPS2 behind the existing Traefik (alongside booking-system).
# Mirrors the proven bpvps1/kaiteki.my stack — see ../../../bpvps1/stacks/stalwart/.
#
# Admin UI : https://mail.blueprintdigital.my     (Stalwart admin + JMAP endpoint)
# Webmail  : https://webmail.blueprintdigital.my  (Bulwark)
#
# TLS: a single LE cert (mail + webmail.blueprintdigital.my) is issued out-of-band via
# Cloudflare DNS-01 (acme.sh, BPD_CF_DNS_API_TOKEN) into ./certs and is used by BOTH
# Stalwart (mail ports, set in the admin UI -> Settings -> TLS, reading the files) AND
# Traefik (web UIs, file provider). Traefik's own CF token only covers teeko.ai. See README.md.
#
# Bulwark talks to Stalwart over JMAP (HTTPS). It reaches the server at
# https://mail.blueprintdigital.my, which resolves INTERNALLY to Traefik (network alias on
# stalwart_mailnet, set in ../traefik/docker-compose.yml) so the LE cert verifies and
# Traefik proxies to stalwart:8080. Stalwart's JMAP session advertises absolute
# mail.blueprintdigital.my URLs, so its hostname MUST be set to that in the admin UI.
#
# IMPORTANT: config.json (the storage pointer) is bind-mounted so a container recreate
# does NOT wipe Stalwart back into bootstrap mode. Do not remove it.
services:
  stalwart:
    # Pinned: :latest would let an unattended `up -d` cross a major (1.0) with a data
    # migration. 0.16.x -> 0.16.y is a plain binary swap. Bump deliberately.
    image: stalwartlabs/stalwart:v0.16.21
    container_name: stalwart
    restart: unless-stopped
    environment:
      # Fallback/recovery admin for the management API. Real value in stack .env (gitignored).
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_RECOVERY_PASS}
      # The base URL clients reach this server on. Stalwart's JMAP session advertises
      # ABSOLUTE URLs built from this, and Bulwark follows them — so if it's wrong the
      # webmail breaks. Set here rather than as a store-only admin-UI setting so it's
      # version-controlled and survives a store rebuild.
      - STALWART_PUBLIC_URL=https://mail.blueprintdigital.my
    ports:
      # Implicit-TLS ports only, matching how bpvps1 is actually configured. Stalwart has
      # no listener on 587/143/110 there, so publishing them would just open dead ports.
      # Add the listener in the admin UI FIRST if a client ever needs STARTTLS submission.
      - "25:25"       # SMTP (inbound)
      - "465:465"     # SMTPS (submission)
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
      - "4190:4190"   # ManageSieve
      - "127.0.0.1:8090:8080"   # management API/UI (loopback only; Traefik serves it publicly)
    volumes:
      - stalwart-data:/opt/stalwart
      - ./certs:/opt/stalwart/certs:ro            # LE cert from acme.sh (chown 2000:2000 to read)
      - ./config.json:/etc/stalwart/config.json   # storage pointer — persistence-critical
    dns:
      - 172.21.0.53   # unbound (below): Spamhaus/URIBL refuse public+shared resolvers
    depends_on:
      - unbound
    networks:
      - mailnet

  # Local recursive DNS resolver — DNSBL lookups only work reliably through it. Spamhaus
  # (and URIBL/SURBL) refuse queries arriving via public/shared resolvers and answer with a
  # sentinel that Stalwart scores 0.0, i.e. every RBL check silently does nothing. Same fix
  # as bpvps1 (2026-08-27), which is where it was caught.
  # ⚠️ IP differs per host: bpvps1's mailnet is 172.16.3.0/24, THIS host is 172.21.0.0/16.
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    networks:
      mailnet:
        ipv4_address: 172.21.0.53   # static: `dns:` needs an IP; mailnet is 172.21.0.0/16

  # Bulwark — modern JMAP webmail built for Stalwart (HTML compose, themes, calendar,
  # contacts, built-in admin dashboard). Login with mailbox creds.
  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - JMAP_SERVER_URL=https://mail.blueprintdigital.my  # -> Traefik (mailnet alias) -> stalwart:8080
      - STALWART_FEATURES=true                    # password change, Sieve filters, etc.
      - APP_NAME=Blueprint Mail
      - SETTINGS_SYNC_ENABLED=true                # server-side per-user settings (needs SESSION_SECRET)
      - SESSION_SECRET=${BULWARK_SESSION_SECRET}  # openssl rand -base64 32; real value in stack .env
      - ADMIN_PASSWORD=${BULWARK_ADMIN_PASSWORD}  # enables Bulwark's built-in admin dashboard (/admin)
    volumes:
      - bulwark-settings:/app/data/settings        # encrypted per-user settings
      - bulwark-admin:/app/data/admin              # admin config, plugins, themes, branding
      - bulwark-admin-state:/app/data/admin-state  # admin login state, audit log, setup token
      - bulwark-telemetry:/app/data/telemetry      # instance id + consent (anonymous)
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - stalwart

volumes:
  stalwart-data:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:

networks:
  # Traefik joins this (external) to reach stalwart:8080 and bulwark:3000.
  mailnet:
    name: stalwart_mailnet
