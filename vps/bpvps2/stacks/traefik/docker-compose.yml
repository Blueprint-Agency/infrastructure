services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # No file provider. It carried only the blueprintdigital.my mail routes and cert, and
      # the mail stack left this host on 2026-09-12 (#12) -- mail is bpvps1's job now.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Second resolver, TLS-ALPN-01 (:443), NO credentials.
      #
      # `letsencrypt` above is DNS-01 against Cloudflare, and CF_DNS_API_TOKEN is
      # scoped to the TEEKO account (teeko.ai only). Cloudflare tokens cannot span
      # accounts, and Traefik reads CF_DNS_API_TOKEN process-wide -- so a second
      # DNS-01 resolver would silently reuse the same teeko token. That is why
      # booking's move to reservetoday.app (BLUEPRINT account) failed with
      # "zone could not be found".
      #
      # TLS-ALPN-01 sidesteps the credential problem entirely: it proves control
      # over :443, so it needs no API token and no account boundary. Requires the
      # record to be DNS-only -- a Cloudflare-proxied (orange) host terminates TLS
      # at the edge and the challenge never reaches this box. Both
      # api*.reservetoday.app records are grey on purpose. No wildcards from this
      # resolver; use `letsencrypt` for those.
      - "--certificatesresolvers.le-tls.acme.tlschallenge=true"
      - "--certificatesresolvers.le-tls.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le-tls.acme.storage=/letsencrypt/acme-tls.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik-bpvps2.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`.+`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      proxy: {}

volumes:
  traefik-letsencrypt:
    external: true
    name: infra_traefik-letsencrypt

networks:
  proxy:
    external: true
