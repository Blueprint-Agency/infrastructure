# monitoring — Grafana Alloy: host + container metrics and container logs to Grafana Cloud.
#
# What is collected: metrics.allowlist (metrics) and config.alloy (logs), next to this file.
# Adding a metric is a line in the allowlist plus the panel or rule that reads it -- CI
# (vps/shared/check-monitoring.py) fails a name nothing reads, and a read name not listed.
#
# Runbook (entitlements, budget, how to silence, the canary tests): docs/monitoring.md.
#
# Outbound only. No host port, no Traefik, no network of its own. Everything it reads is
# mounted read-only; it runs as root inside the container to read /proc, /sys, the cgroup
# tree and the Docker socket, which is what `deploy`'s docker group already grants.
services:
  alloy:
    build: .
    image: blueprint-alloy:local
    pull_policy: build
    # Not keyed on ${ENV_NAME}: one agent per HOST, covering every instance on it.
    container_name: alloy
    restart: unless-stopped
    # The HOST's network namespace, for two reasons. /proc/net is per network namespace, so
    # in a bridge network node_network_* reports the container's own veth -- a flat line of a
    # few KB (measured 2026-09-13).
    network_mode: host
    command:
      - run
      # Host loopback only: the debug UI answers on the host itself and on no interface.
      # Nothing is published, and 80/443 are the only ports the firewall lets in anyway.
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      TZ: Asia/Kuala_Lumpur
      # The `host` label on every metric and log line. Literal, not the kernel hostname: the
      # alert rules match host="bpvps2", and CI (check-monitoring.py) fails if this is not the
      # host's key in vps/hosts.json -- a mismatch would fire the down rule for every container.
      MONITORING_HOST: bpvps2
      # From ci/env.ci, rendered by CI; a blank one fails the deploy -- an agent with an
      # empty token starts happily and ships nothing.
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
    # cadvisor walks the host cgroup tree; with a private cgroup namespace it sees only its own.
    cgroup: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Twice on purpose: node_exporter takes a sysfs path, cadvisor does not -- it reads the
      # cgroup tree at /sys/fs/cgroup and nowhere else.
      - /sys:/sys:ro
      - /:/rootfs:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker 29 stores images in containerd's snapshotter, and cadvisor asks containerd
      # about every container. Without this it logs "cannot unix dial containerd" per
      # container, every minute (seen on bpvps2, 2026-09-13).
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # Log read positions and the metrics WAL: a restart resumes rather than re-ships.
      - alloy_data:/var/lib/alloy/data
      # The textfile seam (#24): producers (backup.prom, ...) write *.prom here and the
      # textfile collector turns them into metrics. Read-only -- the agent never writes a
      # producer's file. Contract: docs/textfile-metrics.md.
      - textfile:/textfile:ro
    # Guard rails on a 1 vCPU / 4 GB host that serves the booking API. Measured use is in
    # docs/monitoring.md; these are ceilings, not the expected figure.
    cpus: 0.5
    mem_limit: 384m

  # The textfile probes (#25): restart counts, Postgres connections, Tailscale key expiry and --
  # on this host only -- bpvps1's mail ports. Writes *.prom into the textfile volume the agent
  # reads. What each job does and how it fails: probes/bin/probe.sh. Identical on every host;
  # only the environment below differs.
  probes:
    build: ./probes
    image: blueprint-probes:local
    pull_policy: build
    container_name: probes
    restart: unless-stopped
    # The host's addresses, so the mail job can tell whether it IS the mail host, and a real
    # outbound path to the target rather than a bridge's NAT.
    network_mode: host
    environment:
      TZ: Asia/Kuala_Lumpur
      # Probed from here because it is the only in-scope host that is NOT the mail host, and a
      # laptop's ISP blocks outbound 25. bpvps1 leaves this unset. probe.sh refuses to probe a
      # target that resolves to one of this host's own addresses.
      MAIL_PROBE_TARGET: mail.blueprintdigital.my
      MAIL_PROBE_PORTS: "25 465 993"
    volumes:
      # docker ps / inspect / exec: restart counts, and psql inside each Postgres container.
      - /var/run/docker.sock:/var/run/docker.sock
      # The directory, not the socket file: a tailscaled restart makes a new socket inode.
      - /var/run/tailscale:/var/run/tailscale:ro
      - textfile:/textfile
    cpus: 0.1
    mem_limit: 64m

volumes:
  alloy_data:
    name: monitoring_alloy_data
  # Shared with every producer stack, so it belongs to none: created by ci/post-sync.sh here
  # and in each producer's (idempotent), whichever stack deploys first.
  textfile:
    external: true
    name: monitoring_textfile
