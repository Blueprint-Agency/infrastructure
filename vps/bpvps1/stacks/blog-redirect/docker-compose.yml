# blog.kaiteki.my -> kaiteki.my/blog. Replaces the retired Kaiteki WordPress blog.
#
# The blog's 152 published posts moved verbatim into the Next.js site (kaiteki-web,
# content/blog/, 2026-10). This is all that is left of the subdomain: one nginx that
# answers every old URL with a 301 to its new home, so links and rankings carry over.
# The map is blog-redirects.conf, GENERATED by kaiteki-web `pnpm blog:redirects` --
# regenerate it there, never edit it here. README.md has the cutover and rollback.
#
# No volumes, no secrets, no database: nothing to back up.
services:
  blog-redirect:
    image: nginx:1.27-alpine
    container_name: blog-redirect
    restart: unless-stopped
    volumes:
      - ./blog-redirects.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 1m
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # kaiteki.my is on the Blueprint Cloudflare account (proxied): Cloudflare terminates
      # public TLS and Traefik serves its default cert to the origin pull, same as the
      # kaiteki stack. Priority 1000 beats the old WordPress router (default priority = rule
      # length) for the same name, so this takes the hostname the moment it starts, and
      # WordPress can then be stopped without a gap.
      - "traefik.http.routers.blog-redirect.rule=Host(`blog.kaiteki.my`)"
      - "traefik.http.routers.blog-redirect.entrypoints=websecure"
      - "traefik.http.routers.blog-redirect.tls=true"
      - "traefik.http.routers.blog-redirect.priority=1000"
      - "traefik.http.services.blog-redirect.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
