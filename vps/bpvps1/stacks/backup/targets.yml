# What bpvps1 backs up. Read by the backup job at every run (bin/backup.sh), so adding a
# database or a volume is a line here plus a deploy -- never a new script.
#
# Kinds, floors and drill_tables: see vps/bpvps2/stacks/backup/targets.yml. Checked in CI by
# vps/shared/check-backup-targets.py. Runbook: docs/backup-restore.md.
#
# Volume floors are du's ALLOCATED size: 4K for the directory plus at least 4K per file,
# however small the file. So a floor here reads "at least this many files", and each is set
# above what an empty, freshly-created volume of the same kind measures (4K).

targets:
  # The Kaiteki WordPress blog. Covers wordpress_wp-db-data.
  # Floor, measured 2026-09-14: live dump 49,037,512 B; posts, postmeta, users and terms
  # alone 18,209,402 B; schema only 66,830 B. 16M (16,777,216 B) sits below the content
  # tables by themselves and far above an empty install. Most of the rest is Rank Math's
  # analytics cache, which a plugin reset may legitimately empty -- so it is not in the floor.
  - name: wordpress
    kind: mysql
    container: wp-db
    database: kaitekim_blog2
    role: root
    floor: 16M
    drill_tables: [kbsb_posts, kbsb_postmeta, kbsb_users, kbsb_terms, kbsb_term_relationships, kbsb_comments]

  # All mail for all three domains: Stalwart's RocksDB store. kind stalwart: the job STOPS
  # `container` for the snapshot, starts it again, and fails the target unless it answers.
  # Why a stop and not an export, how long, and what a failure does to mail:
  # docs/backup-restore.md, "The mail store".
  # Floor, measured 2026-09-14: 7.3G live -- 6.1G of .blob files (message bodies), 1.1G of
  # .sst. An empty store is a few MB. 4G sits well below the blobs alone and far above an
  # empty or freshly re-initialised store.
  - name: mail-store
    kind: stalwart
    container: stalwart
    volume: stalwart_stalwart-data
    floor: 4G

  # Bulwark webmail: encrypted per-user settings, one .enc file per user. 92K live
  # (2026-09-14). An empty volume is 4K; 32K is at least seven users' settings.
  - name: bulwark-settings
    kind: volume
    volume: stalwart_bulwark-settings
    floor: 32K

  # Bulwark admin config and plugin-signing.key. 20K live: admin.json, the key, two
  # migration markers. 12K is at least admin.json and the key.
  - name: bulwark-admin
    kind: volume
    volume: stalwart_bulwark-admin
    floor: 12K

  # Bulwark admin login state and audit log. 12K live: admin-state.json and audit.log.
  - name: bulwark-admin-state
    kind: volume
    volume: stalwart_bulwark-admin-state
    floor: 8K

  # Traefik's ACME account keys and issued certificates: acme.json (letsencrypt, DNS-01) and
  # acme-tls.json (le-tls, webmail.reservetoday.app). Re-issued if lost, but only within Let's
  # Encrypt's rate limits, and a lost account key is a new account. 80K live; 32K is both
  # stores holding more than an account key.
  - name: traefik-certs
    kind: volume
    volume: infra_traefik-letsencrypt
    floor: 32K

skip:
  - volume: stalwart_bulwark-telemetry
    reason: >-
      Bulwark's anonymous telemetry: .telemetry-id, state.json (consent) and logins.json
      (login counters for that telemetry). Checked 2026-09-14 -- no settings, no mail, no
      credentials. Bulwark creates a fresh id when it is empty.
  - volume: backup_restic_cache
    reason: >-
      restic's local index cache; rebuilt from the repository in R2 on the next run. It also
      holds stopped-by-backup/, the record of a container mail-store stopped -- live state
      that only matters mid-run, and a restore of last night's copy would be wrong anyway.
  - volume: monitoring_textfile
    reason: >-
      Heartbeat metrics. backup.prom is rewritten by every successful run; losing it reads
      as stale, which alerts -- the safe direction.
