# Self-hosted email — one Stalwart mail server + one Bulwark (JMAP) webmail, co-hosted on
# BPVPS1 behind the existing Traefik, built to serve MANY domains. (Bulwark replaced
# Roundcube; the mail host was renamed email.kaiteki.my -> mail.kaiteki.my.)
#
# Domains held here: kaiteki.my, blueprintdigital.my, reservetoday.app. A new client domain
# is a domain ADDED to this instance over the JMAP `x:` management API (README.md,
# "Configuring this build"), never a second stack.
#
# JMAP host: https://mail.blueprintdigital.my     (Stalwart's default hostname, and the MX
#                                                  target for every domain but kaiteki.my)
#            https://mail.kaiteki.my              (same server; alias kept for the IMAP
#                                                  clients already configured with it)
# Webmail  : https://webmail.blueprintdigital.my  (Bulwark)
#            https://webmail.kaiteki.my           (same container)
#
# TLS: a single LE cert covering all four mail./webmail. names across the two Cloudflare
# zones is issued out-of-band via Cloudflare DNS-01 (acme.sh, KAITEKI_CF_DNS_API_TOKEN)
# into ./certs and is used by BOTH Stalwart (mail ports, TLS settings referencing the
# files) AND Traefik (web UIs, file provider). Name list: CERT_NAMES in renew-cert.sh.
# See README.md.
#
# Bulwark talks to Stalwart over JMAP (HTTPS). It reaches the server at
# https://mail.kaiteki.my, which resolves INTERNALLY to Traefik (network alias on
# stalwart_mailnet, set in ../traefik/docker-compose.yml) so the LE cert verifies and
# Traefik proxies to stalwart:8080. Stalwart's JMAP session advertises ABSOLUTE URLs built
# from its DEFAULT HOSTNAME and ignores the request's Host header entirely (verified
# 2026-09-12) — so JMAP_SERVER_URL below and Stalwart's default hostname must name the same
# host, and that host must resolve to THIS server for the browser as well as the container.
# Changing one without the other is the single most likely way to break this stack.
#
# IMPORTANT: config.json (the storage pointer) is bind-mounted so a container recreate
# does NOT wipe Stalwart back into bootstrap mode. Do not remove it.
services:
  stalwart:
    # Pinned: :latest would let an unattended `up -d` cross a major (1.0) with a data
    # migration. 0.16.x -> 0.16.y is a plain binary swap. Bump deliberately.
    image: stalwartlabs/stalwart:v0.16.21
    container_name: stalwart
    restart: unless-stopped
    environment:
      # Fallback/recovery admin for the management API. Real value in stack .env (gitignored).
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_RECOVERY_PASS}
    ports:
      - "25:25"       # SMTP (inbound)
      - "465:465"     # SMTPS (submission)
      - "587:587"     # submission STARTTLS
      - "143:143"     # IMAP STARTTLS
      - "993:993"     # IMAPS
      - "110:110"     # POP3
      - "995:995"     # POP3S
      - "4190:4190"   # ManageSieve
      - "127.0.0.1:8090:8080"   # management API/UI (loopback only; Traefik serves it publicly)
    volumes:
      - stalwart-data:/opt/stalwart
      - ./certs:/opt/stalwart/certs:ro            # LE cert from acme.sh (chown 2000:2000 to read)
      - ./config.json:/etc/stalwart/config.json   # storage pointer — persistence-critical
    dns:
      - 172.16.3.53   # unbound (below): Spamhaus/URIBL refuse public+shared resolvers
    depends_on:
      - unbound
    networks:
      - mailnet

  # Local recursive DNS resolver — DNSBL lookups only work through it. Spamhaus (and
  # URIBL/SURBL) refuse queries arriving via public/shared resolvers: through the host
  # default, the test point 2.0.0.127.zen.spamhaus.org returned NXDOMAIN (verified
  # 2026-08-27), i.e. every RBL check silently scored 0. Stalwart's embedded-DNS
  # forwarder points here via `dns:` above. If unbound is down, Stalwart loses outbound
  # DNS entirely (delivery queues + retries; inbound senders retry) — keep it running.
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    networks:
      mailnet:
        ipv4_address: 172.16.3.53   # static: `dns:` needs an IP; mailnet is 172.16.3.0/24

  # Bulwark — modern JMAP webmail built for Stalwart (HTML compose, themes, calendar,
  # contacts, built-in admin dashboard). Login with mailbox creds (e.g. admin@kaiteki.my).
  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Must match Stalwart's default hostname — Bulwark follows the absolute URLs the JMAP
      # session advertises. Since the 2026-09-12 cutover (#9) that is the platform's
      # canonical mail host, mail.blueprintdigital.my; mail.kaiteki.my is an alias of the
      # same box kept alive for already-configured IMAP clients.
      #
      # ⚠️ THIS VALUE IS HANDED TO THE BROWSER, not just used server-side. It is served
      # verbatim as `jmapServerUrl` by https://webmail.<host>/api/config, so the name here is
      # resolved by the VISITOR'S resolver over PUBLIC DNS — the stalwart_mailnet alias on
      # Traefik only covers the container's own lookups. Verified 2026-09-12.
      #
      # So this name's PUBLIC A record must be this server. Point it at a name that resolves
      # elsewhere and every webmail user is sent there — with a valid certificate and no
      # error, if that host also runs a mail server (bpvps2 still does until #12). The hostname
      # here, Stalwart's defaultHostname and the A record move together or not at all:
      # docs/mail/hostname-cutover-constraint.md.
      - JMAP_SERVER_URL=https://mail.blueprintdigital.my
      - STALWART_FEATURES=true                    # password change, Sieve filters, etc.
      - SETTINGS_SYNC_ENABLED=true                # server-side per-user settings (needs SESSION_SECRET)
      # ⚠️ NEVER rotate SESSION_SECRET. It encrypts the per-user settings already written to
      # the bulwark-settings volume; a new value does not log people out, it makes every
      # existing user's saved settings undecryptable.
      - SESSION_SECRET=${BULWARK_SESSION_SECRET}  # openssl rand -base64 32; real value in stack .env
      - ADMIN_PASSWORD=${BULWARK_ADMIN_PASSWORD}  # enables Bulwark's built-in admin dashboard (/admin)
      #
      # ---- Branding (#11) -------------------------------------------------------------
      # Everything below is ENV, never a dashboard upload: the bulwark-admin volume is not
      # backed up, and an admin-dashboard value would silently override all of this (it is
      # the top of Bulwark's priority chain). The files live in ./branding, mounted below.
      #
      # The globals are the agency default. Each webmail hostname then overrides what
      # differs in DOMAIN_BRANDING, matched on the request Host / X-Forwarded-Host, so one
      # container answers as a different brand per URL. Onboarding a client's webmail
      # touches this file twice (an entry here, a mount below) and a few others -- the
      # full list is README.md "Branding" -- but never a second container. Colours are
      # blueprint_marketing_website design tokens: night #1c1039, night-deep #120926,
      # tungsten #ffb13c.
      - APP_NAME=Blueprint Mail
      - APP_SHORT_NAME=Mail
      - APP_DESCRIPTION=Webmail for Blueprint Digital and its clients
      - FAVICON_URL=/branding/blueprint/icon.svg
      - PWA_ICON_URL=/branding/blueprint/icon.svg
      - PWA_THEME_COLOR=#1c1039
      - PWA_BACKGROUND_COLOR=#120926
      - APP_LOGO_LIGHT_URL=/branding/blueprint/login-light.svg
      - APP_LOGO_DARK_URL=/branding/blueprint/login-dark.svg
      - LOGIN_LOGO_LIGHT_URL=/branding/blueprint/login-light.svg
      - LOGIN_LOGO_DARK_URL=/branding/blueprint/login-dark.svg
      - LOGIN_COMPANY_NAME=Blueprint Digital
      - LOGIN_WEBSITE_URL=https://blueprintdigital.my
      - LOGIN_LOGO_MAX_HEIGHT=64px
      # Login page chrome, set on purpose rather than left to defaults. The version number
      # is hidden: it advertised the exact build to anyone scanning us. Heading and
      # subtitle stay (they carry the company name); TOTP stays because accounts may
      # enable 2FA in Stalwart and the field must be there when they do.
      - LOGIN_SHOW_VERSION=false
      - LOGIN_SHOW_HEADING=true
      - LOGIN_SHOW_SUBTITLE=true
      - LOGIN_SHOW_TOTP=true
      # One JSON array. Folded (>-) so each hostname is its own line in the diff; YAML
      # joins the lines with single spaces, which JSON does not mind. The Kaiteki mark is
      # the PNG from blueprint_marketing_website/public/logos (also kaiteki/public/brand);
      # login-dark.png is the same file with the taupe lifted to cream for a dark ground.
      - >-
        DOMAIN_BRANDING=[
        {"host":"webmail.kaiteki.my",
        "appName":"Kaiteki Mail","appShortName":"Kaiteki","appDescription":"Webmail for Kaiteki",
        "faviconUrl":"/branding/kaiteki/favicon.png","pwaIconUrl":"/branding/kaiteki/favicon.png",
        "pwaThemeColor":"#ada190","pwaBackgroundColor":"#ffffff",
        "appLogoLightUrl":"/branding/kaiteki/login-light.png","appLogoDarkUrl":"/branding/kaiteki/login-dark.png",
        "loginLogoLightUrl":"/branding/kaiteki/login-light.png","loginLogoDarkUrl":"/branding/kaiteki/login-dark.png",
        "loginCompanyName":"Kaiteki","loginWebsiteUrl":"https://kaiteki.my"},
        {"host":"webmail.blueprintdigital.my",
        "appName":"Blueprint Mail","loginCompanyName":"Blueprint Digital","loginWebsiteUrl":"https://blueprintdigital.my",
        "faviconUrl":"/branding/blueprint/icon.svg",
        "loginLogoLightUrl":"/branding/blueprint/login-light.svg","loginLogoDarkUrl":"/branding/blueprint/login-dark.svg"}
        ]
      # The Blueprint entry repeats the globals ON PURPOSE: the globals are what an
      # unlisted hostname gets, and this entry is what webmail.blueprintdigital.my gets.
      # Keeping it complete means a later edit to the defaults cannot silently restyle
      # the agency's own webmail, and verify-mail.sh asserts the entry, not the fallback.
    volumes:
      # Logo files, served by Bulwark at /branding/<brand>/... beside its own stock marks
      # (Next.js serves /app/public from disk at request time, so a bind mount is enough;
      # verified 2026-09-12). One mount per brand, as a SUBDIRECTORY rather than over the
      # whole of /app/public/branding, so the stock files still exist for any field that
      # falls back to them. A new client = a new line here + a DOMAIN_BRANDING entry.
      - ./branding/blueprint:/app/public/branding/blueprint:ro
      - ./branding/kaiteki:/app/public/branding/kaiteki:ro
      - bulwark-settings:/app/data/settings        # encrypted per-user settings
      - bulwark-admin:/app/data/admin              # admin config, plugins, themes, branding
      - bulwark-admin-state:/app/data/admin-state  # admin login state, audit log, setup token
      - bulwark-telemetry:/app/data/telemetry      # instance id + consent (anonymous)
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - stalwart

volumes:
  stalwart-data:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:

networks:
  # Traefik joins this (external) to reach stalwart:8080 and bulwark:3000.
  mailnet:
    name: stalwart_mailnet
