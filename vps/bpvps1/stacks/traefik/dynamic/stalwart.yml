# Traefik dynamic config — serves the shared LE cert (acme.sh DNS-01) and routes the mail
# web UIs for every domain this Stalwart is to hold.
#   mail.blueprintdigital.my    -> Stalwart JMAP endpoint (stalwart:8080) — the CANONICAL
#                                  mail host since #9 (2026-09-12): Stalwart's default
#                                  hostname and the MX target for every domain but kaiteki.my
#   mail.kaiteki.my             -> the same Stalwart; alias kept for configured IMAP clients
#   webmail.blueprintdigital.my -> Bulwark webmail (bulwark:3000)
#   webmail.kaiteki.my          -> the same Bulwark
#   webmail.reservetoday.app    -> the same Bulwark, on its OWN certificate (see below)
#
# All five A records point here (187.127.122.41). Routing a name before its A record moved
# cost nothing and removed a step from the cutover: the hosts answered the moment the
# record landed, on a certificate that already covered them. (Not true of the
# reservetoday name — its certificate is only requested once the record resolves here.)
#
# One Stalwart and one Bulwark serve all of these. A second container per domain would
# double the RAM, the upgrades and the config drift for nothing: Bulwark stores no mail,
# and Stalwart is multi-domain by design.
#
# Traefik terminates TLS here using the file cert (no per-host ACME — Traefik's own CF token
# only covers teeko.ai). The one acme.sh cert carries the four mail./webmail. names across
# the two Cloudflare zones; the name list is CERT_NAMES in ../../stalwart/renew-cert.sh.
#
# webmail.reservetoday.app is the exception (#19): its zone is on Vercel, which no DNS-01
# credential here can reach, so it gets its own certificate from Traefik's `le-tls`
# resolver (TLS-ALPN-01, defined in ../docker-compose.yml) and therefore its own router —
# a router carries ONE tls block, and `tls: {}` (file cert) and `certResolver` are
# different blocks. Do not add that name to CERT_NAMES: acme.sh would fail DNS-01 on it
# and the whole four-name renewal with it. Traefik reaches the containers
# over the external stalwart_mailnet network (see the traefik compose), which also carries the
# mail.* network aliases that let Bulwark reach the Stalwart JMAP host internally.
#
# CORS: Bulwark's BROWSER calls JMAP cross-origin (webmail. -> mail.), including
# /.well-known/jmap. Stalwart's own "permissive CORS" only emits `*` and does NOT cover the
# .well-known/jmap discovery redirect, which breaks login. So Traefik owns CORS for the mail
# host: it reflects the specific webmail origin + allows credentials, and answers preflight
# directly. (Stalwart's permissive CORS must be OFF so we don't emit duplicate ACAO headers.)
#
# ⚠️ EVERY webmail origin must be listed, and the list is an ALLOW-LIST, not a wildcard.
# Traefik reflects back whichever origin in the list the browser sent. A cross-domain login —
# a kaiteki.my mailbox signing in at webmail.blueprintdigital.my, or the reverse — is intended
# behaviour here, and it is the browser's origin that decides which entry is needed, not the
# mailbox's domain. Drop an entry and that login fails preflight with no server-side error.
tls:
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/key.pem
http:
  middlewares:
    mail-cors:
      headers:
        accessControlAllowOriginList:
          - "https://webmail.blueprintdigital.my"
          - "https://webmail.kaiteki.my"
          - "https://webmail.reservetoday.app"
        accessControlAllowCredentials: true
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - X-Requested-With
        accessControlAllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - HEAD
          - OPTIONS
        accessControlMaxAge: 100
        addVaryHeader: true
  routers:
    # One router per service, both names in its rule — not a router per hostname. They share a
    # service, a middleware and a certificate, so a second router would only be a second
    # place to forget an edit.
    #
    # ⚠️ Two names means `Host(`a`) || Host(`b`)`, NOT `Host(`a`, `b`)`. The multi-argument
    # form parses as valid YAML and is accepted by the file provider, then fails at router
    # build time on Traefik v3.3 with "unexpected number of parameters; got 2, expected one
    # of [1]" — and a router that fails to build is a router that does not exist, so every
    # name on it 404s while the config file looks perfectly reasonable. Seen for real here on
    # 2026-09-12. The error only appears in `docker logs traefik`; nothing else reports it.
    stalwart-admin:
      entryPoints: [websecure]
      rule: "Host(`mail.blueprintdigital.my`) || Host(`mail.kaiteki.my`)"
      service: stalwart-admin
      middlewares: [mail-cors]
      tls: {}
    bulwark:
      entryPoints: [websecure]
      rule: "Host(`webmail.blueprintdigital.my`) || Host(`webmail.kaiteki.my`)"
      service: bulwark
      tls: {}
    # The one deliberate second router for a service (#19): same Bulwark, but this name's
    # certificate comes from the `le-tls` ACME resolver, not the file cert above, and a
    # router has exactly one tls block. Everything else about it — service, no CORS
    # middleware (Bulwark itself is same-origin; CORS is on the mail.* router) — matches
    # `bulwark`. If a third Vercel-served name ever appears, it joins THIS rule with `||`.
    bulwark-reservetoday:
      entryPoints: [websecure]
      rule: "Host(`webmail.reservetoday.app`)"
      service: bulwark
      tls:
        certResolver: le-tls
  services:
    stalwart-admin:
      loadBalancer:
        servers:
          - url: "http://stalwart:8080"
    bulwark:
      loadBalancer:
        servers:
          - url: "http://bulwark:3000"
