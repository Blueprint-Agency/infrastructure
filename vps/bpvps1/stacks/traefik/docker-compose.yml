services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # File provider supplies the Stalwart/Roundcube routes + the kaiteki.my cert.
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
      - ./dynamic:/dynamic:ro
      # Shared kaiteki.my cert (acme.sh DNS-01) used for the mail web UIs.
      - /root/stacks/stalwart/certs:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik-bpvps1.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`.+`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      proxy: {}
      # Alias the mail hostnames -> Traefik on the mail network, so the Bulwark webmail
      # container resolves the Stalwart JMAP host to Traefik and gets a valid cert;
      # Traefik then proxies to stalwart:8080.
      #
      # mail.blueprintdigital.my is the live one since #9 (2026-09-12): it is what Bulwark's
      # JMAP_SERVER_URL points at and what Stalwart advertises in its JMAP session.
      # mail.kaiteki.my is the same box under its old name, kept for configured clients.
      #
      # An alias only changes what the BULWARK CONTAINER resolves. It does not make a name
      # usable by browsers, because Bulwark serves its JMAP host to the browser in
      # /api/config and the browser uses public DNS. Adding a name here is half of a move
      # whose other half is the A record — docs/mail/hostname-cutover-constraint.md.
      # Aliases only apply on container (re)create: `compose up -d traefik` after editing.
      mailnet:
        aliases:
          - mail.blueprintdigital.my
          - mail.kaiteki.my

volumes:
  traefik-letsencrypt:
    external: true
    name: infra_traefik-letsencrypt

networks:
  proxy:
    external: true
  # Lets Traefik reach the co-hosted Stalwart + Roundcube containers.
  # Created by the stalwart stack at /root/stacks/stalwart.
  mailnet:
    external: true
    name: stalwart_mailnet
